# Templated by owasp/modsecurity-crs image (envsubst).
# Serves a health page when no real upstream is configured.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen ${PORT} default_server;
    server_name _;
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/setup.conf;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'niktiar-secure-edge-ok\n';
    }

    location / {
        # Placeholder origin — replace BACKEND when protecting a real site
        proxy_pass ${BACKEND};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # If backend is the dummy closed port, show banner instead of 502 spam
        error_page 502 503 504 = @edge_banner;
    }

    location @edge_banner {
        default_type text/plain;
        return 200 'NikTiar Secure Edge online — WAF active. Configure SECURE_EDGE_BACKEND to your origin.\n';
    }
}
