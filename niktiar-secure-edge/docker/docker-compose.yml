# NikTiar Secure Edge — complete appliance
# Dashboard: http://<edge-ip>:9080/
services:
  origin:
    image: nginx:1.27-alpine
    container_name: niktiar-se-origin
    restart: unless-stopped
    volumes:
      - ./origin.html:/usr/share/nginx/html/index.html:ro
    networks:
      - edge

  waf:
    image: ghcr.io/coreruleset/coraza-crs:caddy-alpine
    container_name: niktiar-se-waf
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      TZ: UTC
      PORT: "8080"
      BACKEND: http://origin:80
      LOGLEVEL: WARN
      CORAZA_RULE_ENGINE: On
      BLOCKING_PARANOIA: "1"
      PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      PROXY_TIMEOUT: 60s
      KEEPALIVE_TIMEOUT: 60s
      ACME_EMAIL: ${ACME_EMAIL:-ops@niktiar.local}
    volumes:
      - waf_logs:/var/log/caddy
      - ../runtime/caddy:/config/caddy
      - ../runtime:/runtime
      - ../runtime/coraza-overrides:/opt/coraza/overrides
      - ../runtime/coraza-rules.d:/opt/coraza/rules.d
    depends_on:
      - origin
    networks:
      - edge

  crowdsec:
    image: crowdsecurity/crowdsec:v1.6.4
    container_name: niktiar-se-crowdsec
    restart: unless-stopped
    ports:
      - "127.0.0.1:7422:8080"
    environment:
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/http-dos crowdsecurity/caddy"
      TZ: UTC
      CUSTOM_HOSTNAME: niktiar-secure-edge
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - ../crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ../runtime:/runtime:ro
    networks:
      - edge

  crowdsec-firewall-bouncer:
    image: ghcr.io/shgew/cs-firewall-bouncer-docker:latest
    container_name: niktiar-se-cs-fw
    restart: unless-stopped
    depends_on:
      - crowdsec
    volumes:
      - ../crowdsec/bouncer.yaml:/config/crowdsec-firewall-bouncer.yaml:ro
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW

  dns-feed-sync:
    build:
      context: ../dns-filter
    container_name: niktiar-se-dns-sync
    restart: unless-stopped
    environment:
      RUNTIME_DIR: /runtime
      NIKTIAR_DNS_UPSTREAM: ${NIKTIAR_DNS_UPSTREAM:-1.1.1.1,8.8.8.8}
      NIKTIAR_DNS_SINKHOLE: ${NIKTIAR_DNS_SINKHOLE:-0.0.0.0}
      NIKTIAR_DNS_COMMERCIAL_FEED_URL: ${NIKTIAR_DNS_COMMERCIAL_FEED_URL:-}
      NIKTIAR_DNS_COMMERCIAL_BLOCKLIST_URL: ${NIKTIAR_DNS_COMMERCIAL_BLOCKLIST_URL:-}
      NIKTIAR_DNS_COMMERCIAL_API_KEY: ${NIKTIAR_DNS_COMMERCIAL_API_KEY:-}
      NIKTIAR_DNS_WAF_DOMAIN_CAP: ${NIKTIAR_DNS_WAF_DOMAIN_CAP:-5000}
    volumes:
      - ../runtime:/runtime
    networks:
      - edge

  dns-filter:
    image: spx01/blocky:v0.24
    container_name: niktiar-se-dns
    restart: unless-stopped
    # Bind to LAN IP (not 0.0.0.0) so systemd-resolved stub on 127.0.0.53 keeps working
    ports:
      - "${NIKTIAR_DNS_BIND_IP:-192.168.0.217}:53:53/udp"
      - "${NIKTIAR_DNS_BIND_IP:-192.168.0.217}:53:53/tcp"
      - "127.0.0.1:4053:4000"
    volumes:
      - ../runtime/dns-filter/config.yml:/app/config.yml:ro
      - ../runtime/dns-feeds:/runtime/dns-feeds:ro
    depends_on:
      - dns-feed-sync
    networks:
      - edge

  dashboard:
    build:
      context: ../dashboard
    container_name: niktiar-se-dashboard
    restart: unless-stopped
    ports:
      - "9080:9080"
    environment:
      NIKTIAR_CONTROL_URL: ${NIKTIAR_CONTROL_URL:-http://192.168.0.201:8000}
      NIKTIAR_APPLIANCE_TOKEN: ${NIKTIAR_APPLIANCE_TOKEN:-}
      SECURE_EDGE_HOSTNAME: ${SECURE_EDGE_HOSTNAME:-niktiar-secure-edge}
      SECURE_EDGE_MODE: ${SECURE_EDGE_MODE:-dedicated}
      SECURE_EDGE_FORM_FACTOR: ${SECURE_EDGE_FORM_FACTOR:-ha_pair}
      SECURE_EDGE_HA_ROLE: ${SECURE_EDGE_HA_ROLE:-primary}
      EDGE_DASHBOARD_USER: ${EDGE_DASHBOARD_USER:-admin}
      EDGE_DASHBOARD_PASSWORD: ${EDGE_DASHBOARD_PASSWORD:-NikTiarEdge!ChangeMe}
      RUNTIME_DIR: /runtime
      WAF_CONTAINER: niktiar-se-waf
      CROWDSEC_CONTAINER: niktiar-se-crowdsec
      DNS_FILTER_CONTAINER: niktiar-se-dns
      DNS_FEED_SYNC_CONTAINER: niktiar-se-dns-sync
      ACCESS_LOG: /runtime/niktiar-access.log
    volumes:
      - ../runtime:/runtime
      - ../runtime/caddy:/config/caddy
      - ../crowdsec:/opt/niktiar-secure-edge/crowdsec
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - waf
      - crowdsec
      - dns-filter
    networks:
      - edge

  agent:
    build:
      context: ../agent
    container_name: niktiar-se-agent
    restart: unless-stopped
    environment:
      NIKTIAR_CONTROL_URL: ${NIKTIAR_CONTROL_URL:-http://192.168.0.201:8000}
      NIKTIAR_TENANT_CODE: ${NIKTIAR_TENANT_CODE:-}
      NIKTIAR_APPLIANCE_TOKEN: ${NIKTIAR_APPLIANCE_TOKEN:-}
      SECURE_EDGE_HOSTNAME: ${SECURE_EDGE_HOSTNAME:-niktiar-secure-edge}
      SECURE_EDGE_MODE: ${SECURE_EDGE_MODE:-dedicated}
      SECURE_EDGE_FORM_FACTOR: ${SECURE_EDGE_FORM_FACTOR:-ha_pair}
      SECURE_EDGE_HA_ROLE: ${SECURE_EDGE_HA_ROLE:-primary}
      WAF_CONTAINER: niktiar-se-waf
      RUNTIME_DIR: /runtime
      CADDY_CONFIG_DIR: /config/caddy
      ACCESS_LOG: /runtime/niktiar-access.log
    volumes:
      - ../runtime:/runtime
      - ../runtime/caddy:/config/caddy
      - ../agent/config.yaml:/app/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - waf
      - crowdsec
      - dashboard
    networks:
      - edge

volumes:
  waf_logs:
  crowdsec_data:
  crowdsec_config:

networks:
  edge:
    driver: bridge
