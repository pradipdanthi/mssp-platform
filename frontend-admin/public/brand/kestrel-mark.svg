<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-hidden="true">
  <!-- KB-018A: original geometric kestrel/raptor mark. No product text. -->
  <defs>
    <linearGradient id="kc-mark-accent" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- Shield frame -->
  <path
    fill="#0B1220"
    stroke="#24334F"
    stroke-width="2"
    d="M32 4 L54 12 V30 C54 44 44 54 32 60 C20 54 10 44 10 30 V12 Z"
  />
  <!-- Inner shield plane -->
  <path
    fill="#121B2E"
    d="M32 9 L49 15.5 V30 C49 41.5 41 50 32 55 C23 50 15 41.5 15 30 V15.5 Z"
  />
  <!-- Raptor head profile (beak left, crown right) -->
  <path
    fill="url(#kc-mark-accent)"
    d="M18 34 L26 22 L34 18 L40 20 L44 26 L42 32 L36 36 L30 38 L24 40 L18 36 Z"
  />
  <!-- Beak tip -->
  <path fill="#0EA5E9" d="M18 34 L12 32 L18 30 Z"/>
  <!-- Cyber eye -->
  <circle cx="34" cy="27" r="4.2" fill="#0B1220"/>
  <circle cx="34" cy="27" r="2.2" fill="#34D399"/>
  <circle cx="34.8" cy="26.2" r="0.7" fill="#E7ECF6"/>
  <!-- Subtle K negative-space wing slash -->
  <path
    fill="none"
    stroke="#182640"
    stroke-width="2.2"
    stroke-linecap="square"
    d="M28 42 L34 36 L40 44"
  />
</svg>
