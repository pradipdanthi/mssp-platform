server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve backend-api after container recreate (Docker embedded DNS).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Browser calls /api/*; strip prefix and proxy to the control-plane API.
    location /api/ {
        set $backend_upstream backend-api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA: do not use "$uri/" — a physical dist/assets/ folder breaks refresh on /assets.
    location / {
        try_files $uri /index.html;
    }
}
