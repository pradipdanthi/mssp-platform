services:
  postgres:
    image: postgres:16-alpine
    container_name: mssp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Loopback only — Appliance Management VM 114 reaches DB via SSH tunnel (KB-093L).
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - mssp-backend

  redis:
    image: redis:7-alpine
    container_name: mssp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      TZ: ${TZ}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Loopback only — paired with Postgres expose for VM 114 tunnel (KB-093L).
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - mssp-backend

  backend-api:
    build:
      context: ./backend-api
    container_name: mssp-backend-api
    restart: unless-stopped
    environment:
      APP_NAME: MSSP Control Plane API
      APP_ENV: ${APP_ENV}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SOC_SYNC_API_KEY_FILE: /run/secrets/soc_sync_api_key
      WAZUH_INGRESS_TOKEN_FILE: /run/secrets/wazuh_ingress_token
      SHUFFLE_WEBHOOK_URL_FILE: /run/secrets/shuffle_webhook_url
      VULN_SYNC_API_KEY_FILE: /run/secrets/vuln_sync_api_key
      EASM_SYNC_API_KEY_FILE: /run/secrets/easm_sync_api_key
      EASM_DISPATCH_MODE: ${EASM_DISPATCH_MODE:-remote}
      VELOCIRAPTOR_SERVER_URL: ${VELOCIRAPTOR_SERVER_URL:-http://192.168.0.220:8001}
      VELOCIRAPTOR_BRIDGE_API_KEY_FILE: /run/secrets/velociraptor_bridge_api_key
      MISP_URL: ${MISP_URL:-http://192.168.0.218:8080}
      MISP_API_KEY_FILE: /run/secrets/misp_api_key
      MISP_VERIFY_TLS: ${MISP_VERIFY_TLS:-false}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_GRAPH_BASE_URL: ${AZURE_GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}
      THEHIVE_URL: ${THEHIVE_URL:-http://192.168.0.212:9000}
      THEHIVE_USER: ${THEHIVE_USER:-admin@thehive.local}
      THEHIVE_PASSWORD_FILE: /run/secrets/thehive_password
      THEHIVE_DEFAULT_ORG: ${THEHIVE_DEFAULT_ORG:-MSSP}
      WAZUH_API_URL: ${WAZUH_API_URL:-https://192.168.0.211:55000}
      WAZUH_API_USER_FILE: /run/secrets/wazuh_api_user
      WAZUH_API_PASSWORD_FILE: /run/secrets/wazuh_api_password
      WAZUH_API_VERIFY_TLS: ${WAZUH_API_VERIFY_TLS:-false}
      # Empty = fail-closed (require agent group → tenant binding). Set only for emergency override.
      WAZUH_DEFAULT_TENANT_SHORT_CODE: ${WAZUH_DEFAULT_TENANT_SHORT_CODE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-MSSP Control Plane <onboarding@resend.dev>}
      SALES_NOTIFY_EMAIL: ${SALES_NOTIFY_EMAIL:-sales@kevantic.com}
      ADMIN_PORTAL_BASE_URL: ${ADMIN_PORTAL_BASE_URL:-https://admin.kevantic.com}
      CUSTOMER_PORTAL_BASE_URL: ${CUSTOMER_PORTAL_BASE_URL:-https://portal.kevantic.com}
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:-kevantic.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TZ: ${TZ}
      # KB-092 AI alert analysis → dedicated Ollama VM (off by default)
      AI_ALERT_ENABLED: ${AI_ALERT_ENABLED:-false}
      AI_ALERT_PROVIDER: ${AI_ALERT_PROVIDER:-openai_compatible}
      AI_ALERT_BASE_URL: ${AI_ALERT_BASE_URL:-}
      AI_ALERT_API_KEY: ${AI_ALERT_API_KEY:-}
      AI_ALERT_MODEL: ${AI_ALERT_MODEL:-qwen2.5:14b}
      AI_ALERT_QUEUE_KEY: ${AI_ALERT_QUEUE_KEY:-mssp:ai:alert_analysis}
      AI_ALERT_MIN_SEVERITY: ${AI_ALERT_MIN_SEVERITY:-high}
      AI_ALERT_TIMEOUT_SECONDS: ${AI_ALERT_TIMEOUT_SECONDS:-90}
      # KB-096: enrich/correlate/risk draft (default off — enable after validation)
      AI_SOC_TRIAGE_ENABLED: ${AI_SOC_TRIAGE_ENABLED:-false}
      AI_CHAT_ENABLED: ${AI_CHAT_ENABLED:-false}
      KEVANTIC_LICENSE_PRIVATE_KEY_PEM: ${KEVANTIC_LICENSE_PRIVATE_KEY_PEM:-}
      JUNEXIS_LICENSE_PRIVATE_KEY_PEM: ${JUNEXIS_LICENSE_PRIVATE_KEY_PEM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./.secrets/soc_sync_api_key:/run/secrets/soc_sync_api_key:ro
      - ./.secrets/wazuh_ingress_token:/run/secrets/wazuh_ingress_token:ro
      - ./.secrets/shuffle_webhook_url:/run/secrets/shuffle_webhook_url:ro
      - ./.secrets/vuln_sync_api_key:/run/secrets/vuln_sync_api_key:ro
      - ./.secrets/easm_sync_api_key:/run/secrets/easm_sync_api_key:ro
      - ./.secrets/velociraptor_bridge_api_key:/run/secrets/velociraptor_bridge_api_key:ro
      - ./.secrets/misp_api_key:/run/secrets/misp_api_key:ro
      - ./.secrets/thehive_password:/run/secrets/thehive_password:ro
      - ./.secrets/wazuh_api_user:/run/secrets/wazuh_api_user:ro
      - ./.secrets/wazuh_api_password:/run/secrets/wazuh_api_password:ro
    networks:
      - mssp-backend

  # Production Admin / SOC portal (nginx static build; /api → backend-api).
  frontend-admin:
    build:
      context: ./frontend-admin
    container_name: mssp-frontend-admin
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    depends_on:
      - backend-api
    ports:
      - "3000:80"
    networks:
      - mssp-backend

  # Production Customer portal (nginx static build; /api → backend-api).
  frontend-customer:
    build:
      context: ./frontend-customer
    container_name: mssp-frontend-customer
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    depends_on:
      - backend-api
    ports:
      - "3001:80"
    networks:
      - mssp-backend

volumes:
  postgres_data:
  redis_data:

networks:
  mssp-backend:
    driver: bridge
