services:
  postgres:
    image: postgres:16-alpine
    container_name: mssp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mssp-backend

  redis:
    image: redis:7-alpine
    container_name: mssp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mssp-backend

  backend-api:
    build:
      context: ./backend-api
    container_name: mssp-backend-api
    restart: unless-stopped
    environment:
      APP_NAME: MSSP Control Plane API
      APP_ENV: ${APP_ENV}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT}:8000"
    networks:
      - mssp-backend

  # KB-018: admin frontend foundation. Vite dev server only in this
  # module (no nginx/static production build yet) - see
  # frontend-admin/Dockerfile. Reaches backend-api only through Vite's
  # own dev-server proxy (frontend-admin/vite.config.ts), so no CORS
  # changes were needed on backend-api.
  frontend-admin:
    build:
      context: ./frontend-admin
    container_name: mssp-frontend-admin
    restart: unless-stopped
    depends_on:
      - backend-api
    ports:
      - "3000:5173"
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    networks:
      - mssp-backend

  # KB-021: customer portal foundation. Separate from frontend-admin.
  # Vite dev server; proxies /api to backend-api (no CORS changes).
  frontend-customer:
    build:
      context: ./frontend-customer
    container_name: mssp-frontend-customer
    restart: unless-stopped
    depends_on:
      - backend-api
    ports:
      - "3001:5173"
    volumes:
      - ./frontend-customer:/app
      - /app/node_modules
    networks:
      - mssp-backend

volumes:
  postgres_data:
  redis_data:

networks:
  mssp-backend:
    driver: bridge
