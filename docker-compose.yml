services:
  postgres:
    image: postgres:16-alpine
    container_name: mssp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mssp-backend

  redis:
    image: redis:7-alpine
    container_name: mssp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mssp-backend

  backend-api:
    build:
      context: ./backend-api
    container_name: mssp-backend-api
    restart: unless-stopped
    environment:
      APP_NAME: MSSP Control Plane API
      APP_ENV: ${APP_ENV}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SOC_SYNC_API_KEY_FILE: /run/secrets/soc_sync_api_key
      WAZUH_INGRESS_TOKEN_FILE: /run/secrets/wazuh_ingress_token
      SHUFFLE_WEBHOOK_URL_FILE: /run/secrets/shuffle_webhook_url
      VULN_SYNC_API_KEY_FILE: /run/secrets/vuln_sync_api_key
      THEHIVE_URL: ${THEHIVE_URL:-http://192.168.0.212:9000}
      THEHIVE_USER: ${THEHIVE_USER:-admin@thehive.local}
      THEHIVE_PASSWORD_FILE: /run/secrets/thehive_password
      THEHIVE_DEFAULT_ORG: ${THEHIVE_DEFAULT_ORG:-MSSP}
      WAZUH_API_URL: ${WAZUH_API_URL:-https://192.168.0.211:55000}
      WAZUH_API_USER_FILE: /run/secrets/wazuh_api_user
      WAZUH_API_PASSWORD_FILE: /run/secrets/wazuh_api_password
      WAZUH_API_VERIFY_TLS: ${WAZUH_API_VERIFY_TLS:-false}
      # Empty = fail-closed (require agent group → tenant binding). Set only for emergency override.
      WAZUH_DEFAULT_TENANT_SHORT_CODE: ${WAZUH_DEFAULT_TENANT_SHORT_CODE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-MSSP Control Plane <onboarding@resend.dev>}
      SALES_NOTIFY_EMAIL: ${SALES_NOTIFY_EMAIL:-sales@keroxsys.com}
      ADMIN_PORTAL_BASE_URL: ${ADMIN_PORTAL_BASE_URL:-http://192.168.0.201:3000}
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT}:8000"
    volumes:
      - ./.secrets/soc_sync_api_key:/run/secrets/soc_sync_api_key:ro
      - ./.secrets/wazuh_ingress_token:/run/secrets/wazuh_ingress_token:ro
      - ./.secrets/shuffle_webhook_url:/run/secrets/shuffle_webhook_url:ro
      - ./.secrets/vuln_sync_api_key:/run/secrets/vuln_sync_api_key:ro
      - ./.secrets/thehive_password:/run/secrets/thehive_password:ro
      - ./.secrets/wazuh_api_user:/run/secrets/wazuh_api_user:ro
      - ./.secrets/wazuh_api_password:/run/secrets/wazuh_api_password:ro
    networks:
      - mssp-backend

  # Production Admin / SOC portal (nginx static build; /api → backend-api).
  frontend-admin:
    build:
      context: ./frontend-admin
    container_name: mssp-frontend-admin
    restart: unless-stopped
    depends_on:
      - backend-api
    ports:
      - "3000:80"
    networks:
      - mssp-backend

  # Production Customer portal (nginx static build; /api → backend-api).
  frontend-customer:
    build:
      context: ./frontend-customer
    container_name: mssp-frontend-customer
    restart: unless-stopped
    depends_on:
      - backend-api
    ports:
      - "3001:80"
    networks:
      - mssp-backend

volumes:
  postgres_data:
  redis_data:

networks:
  mssp-backend:
    driver: bridge
