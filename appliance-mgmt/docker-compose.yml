# Junexis Appliance Management plane (VM 114 — 192.168.0.224).
# Appliance-facing API only; Admin/Customer stay on mssp-control (VM 100).
# Uses host network so the container can reach the SSH tunnel on 127.0.0.1
# (Postgres/Redis loopback forwards to VM 100).
services:
  appliance-mgmt-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    image: junexis-appliance-mgmt-api:local
    container_name: junexis-appliance-mgmt-api
    restart: unless-stopped
    network_mode: host
    command:
      [
        "uvicorn",
        "app.main_appliance_mgmt:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    environment:
      APP_NAME: Junexis Appliance Management API
      APP_ENV: ${APP_ENV:-production}
      POSTGRES_HOST: ${POSTGRES_HOST:-127.0.0.1}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-127.0.0.1}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ:-Asia/Kolkata}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
