{
  "version": 1,
  "name": "mssp_endpoint_telemetry",
  "description": "MSSP control-plane pack: process execution, FIM, and network sockets",
  "queries": [
    {
      "name": "process_events_snapshot",
      "description": "Running processes with parent linkage",
      "query": "SELECT pid, parent, name, path, cmdline, uid, cwd, start_time FROM processes;",
      "interval": 300,
      "platform": "linux,darwin,windows",
      "version": "2.0.0"
    },
    {
      "name": "process_open_sockets",
      "description": "Network sockets bound to processes",
      "query": "SELECT DISTINCT p.pid, p.name, p.path, pos.protocol, pos.local_address, pos.local_port, pos.remote_address, pos.remote_port, pos.state FROM process_open_sockets pos JOIN processes p ON pos.pid = p.pid WHERE pos.remote_address != '' AND pos.remote_address != '0.0.0.0' AND pos.remote_address != '::';",
      "interval": 300,
      "platform": "linux,darwin,windows",
      "version": "2.0.0"
    },
    {
      "name": "fim_critical_paths",
      "description": "File integrity monitoring for critical paths",
      "query": "SELECT * FROM file WHERE path LIKE '/etc/%' OR path LIKE '/usr/bin/%' OR path LIKE '/usr/sbin/%' OR path LIKE 'C:\\Windows\\System32\\%' LIMIT 500;",
      "interval": 3600,
      "platform": "linux,darwin,windows",
      "version": "2.0.0"
    },
    {
      "name": "listening_ports",
      "description": "Listening network ports",
      "query": "SELECT DISTINCT process.name, listening_ports.port, listening_ports.protocol, listening_ports.address FROM listening_ports JOIN processes USING (pid);",
      "interval": 600,
      "platform": "linux,darwin,windows",
      "version": "2.0.0"
    },
    {
      "name": "logged_in_users",
      "description": "Interactive sessions",
      "query": "SELECT * FROM logged_in_users;",
      "interval": 600,
      "platform": "linux,darwin,windows",
      "version": "2.0.0"
    },
    {
      "name": "hash_running_binaries",
      "description": "SHA256 of notable running binaries",
      "query": "SELECT p.pid, p.name, p.path, h.sha256 FROM processes p JOIN hash h ON h.path = p.path WHERE p.path != '' LIMIT 200;",
      "interval": 3600,
      "platform": "linux,darwin,windows",
      "version": "2.0.0"
    }
  ]
}
