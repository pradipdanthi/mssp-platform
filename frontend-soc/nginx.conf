# HTTP kept for convenience; microphone/voice requires the HTTPS listener.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Permissions-Policy "microphone=(self)" always;
    add_header Feature-Policy "microphone 'self'" always;

    location /api/ {
        set $backend_upstream backend-api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Secure context for Chrome/Edge mic + voice (self-signed lab cert).
server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/soc.crt;
    ssl_certificate_key /etc/nginx/certs/soc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Permissions-Policy "microphone=(self)" always;
    add_header Feature-Policy "microphone 'self'" always;

    # Lab cert download so Windows can trust this origin (fixes Chrome mic not-allowed).
    location = /soc-lab.crt {
        alias /etc/nginx/certs/soc.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="kevantic-soc-lab.crt"' always;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        set $backend_upstream backend-api;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
