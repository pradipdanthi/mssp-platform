---
# Full provision used by ISO firstboot (and factory rebuilds).
# TheHive / Shuffle must never appear on the appliance.
- name: Kevantic appliance install provision
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: minimize
    - role: boot_splash
    - role: harden_cis
    - role: firewall_nftables
      vars:
        firewall_nftables_mode: "{{ firewall_nftables_mode | default('bootstrap') }}"
    - role: apparmor_profiles
    - role: auditd
    - role: container_runtime
    - role: kevantic_runtime
    - role: channel_agent
    - role: license_enforcer
    - role: wazuh_local
    - role: catalogue_engines
    - role: ota_staging
    - role: service_manager
  post_tasks:
    - name: Assert case-management / SOAR packages absent
      ansible.builtin.shell: |
        set -e
        if dpkg -l 2>/dev/null | grep -qiE 'thehive|cortex|shuffle'; then
          echo "FORBIDDEN packages on appliance" >&2
          exit 1
        fi
        echo OK
      args:
        executable: /bin/bash
      changed_when: false

    - name: Assert idle catalogue engine worker present
      ansible.builtin.stat:
        path: /usr/bin/kevantic-engine-worker
      register: kevantic_engine_worker

    - name: Fail if catalogue engine worker missing
      ansible.builtin.assert:
        that:
          - kevantic_engine_worker.stat.exists
        fail_msg: "kevantic-engine-worker missing — catalogue engines not provisioned"

    - name: Assert boot splash theme installed
      ansible.builtin.stat:
        path: /usr/share/plymouth/themes/kevantic/kevantic-boot.png
      register: kevantic_splash_png

    - name: Fail if splash artwork missing after boot_splash role
      ansible.builtin.assert:
        that:
          - kevantic_splash_png.stat.exists
        fail_msg: "Kevantic boot splash PNG missing after provision"

    - name: Assert critical-alert forwarder unit installed (KB-093P golden image)
      ansible.builtin.stat:
        path: /etc/systemd/system/kevantic-critical-alert-forwarder.service
      register: kevantic_fwd_unit

    - name: Fail if critical-alert forwarder not baked into image
      ansible.builtin.assert:
        that:
          - kevantic_fwd_unit.stat.exists
        fail_msg: >-
          kevantic-critical-alert-forwarder.service missing — golden image must
          include local→cloud critical alert forwarding (KB-093P).

    - name: Assert critical-alert forwarder enabled at boot
      ansible.builtin.command: systemctl is-enabled kevantic-critical-alert-forwarder.service
      register: kevantic_fwd_enabled
      changed_when: false
      failed_when: kevantic_fwd_enabled.stdout.strip() != "enabled"
