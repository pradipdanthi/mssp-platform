---
# One-time field upgrade for appliances built before KB-093P.
# Future appliances: rebuild golden image (install-provision.yml) — do not rely on this.
- name: Upgrade existing appliance with critical-alert forwarder (KB-093P)
  hosts: all
  become: true
  gather_facts: true
  vars:
    kevantic_repo_root: "{{ playbook_dir }}/../.."
  tasks:
    - name: Detect Junexis vs kevantic layout
      ansible.builtin.stat:
        path: /opt/junexis/appliance-src
      register: junexis_src

    - name: Set brand paths
      ansible.builtin.set_fact:
        appliance_src: "{{ '/opt/junexis/appliance-src' if junexis_src.stat.exists else '/opt/kevantic/appliance-src' }}"
        env_file: "{{ '/etc/junexis/appliance.env' if junexis_src.stat.exists else '/etc/kevantic/appliance.env' }}"
        unit_name: "{{ 'junexis-critical-alert-forwarder.service' if junexis_src.stat.exists else 'kevantic-critical-alert-forwarder.service' }}"
        telemetry_key: "{{ 'JUNEXIS_TELEMETRY_URL' if junexis_src.stat.exists else 'KEVANTIC_TELEMETRY_URL' }}"

    - name: Ensure appliance-src telemetry directory
      ansible.builtin.file:
        path: "{{ appliance_src }}/appliance/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - telemetry
        - common

     - name: Sync appliance telemetry + privacy modules from golden repo
      ansible.builtin.copy:
        src: "{{ kevantic_repo_root }}/appliance/{{ item }}"
        dest: "{{ appliance_src }}/appliance/{{ item }}"
        mode: "0644"
      loop:
        - telemetry/critical_alert_watcher.py
        - telemetry/forwarder.py
        - telemetry/__init__.py
        - common/privacy.py

    - name: Install both brand unit files
      ansible.builtin.copy:
        src: "{{ kevantic_repo_root }}/configs/systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - kevantic-critical-alert-forwarder.service
        - junexis-critical-alert-forwarder.service

    - name: Install inventory helper
      ansible.builtin.copy:
        src: "{{ kevantic_repo_root }}/scripts/kevantic-list-local-agents"
        dest: /usr/bin/kevantic-list-local-agents
        mode: "0755"

    - name: Ensure runtime dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /run/junexis
        - /run/kevantic
        - /var/log/junexis
        - /var/log/kevantic

    - name: Point telemetry URL at SOC control plane VM 100 (not Appliance Mgmt heartbeat host)
      ansible.builtin.lineinfile:
        path: "{{ env_file }}"
        create: true
        mode: "0640"
        regexp: "^(JUNEXIS|KEVANTIC)_TELEMETRY_URL="
        line: "{{ telemetry_key }}={{ kevantic_soc_telemetry_url | default('http://192.168.0.201:8000/api/v1/telemetry/ingest') }}"

    - name: Enable and start brand forwarder unit
      ansible.builtin.systemd:
        name: "{{ unit_name }}"
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Report status
      ansible.builtin.command: "systemctl is-active {{ unit_name }}"
      register: fwd_status
      changed_when: false

    - name: Show result
      ansible.builtin.debug:
        msg: "KB-093P forwarder {{ unit_name }} => {{ fwd_status.stdout }}"
