---
# Role: wazuh_local — install local Manager + Fluent Bit (+ NDR pkgs), leave idle
- name: Apply role when enabled
  when: wazuh_local_enabled | bool
  block:
  - name: Resolve offline package pool
    ansible.builtin.set_fact:
      wazuh_local_offline_pool: >-
        {{
          wazuh_local_offline_packages_dir
          if (wazuh_local_offline_packages_dir | length) > 0
          else (
            (kevantic_payload_root | default('/opt/kevantic/payload'))
            ~ '/offline-packages'
          )
        }}

  - name: Check offline package pool
    ansible.builtin.stat:
      path: "{{ wazuh_local_offline_pool }}"
    register: wazuh_offline_dir

  - name: List offline .deb packages
    ansible.builtin.find:
      paths: "{{ wazuh_local_offline_pool }}"
      patterns: "*.deb"
      file_type: file
    register: wazuh_offline_debs
    when: wazuh_offline_dir.stat.exists | default(false)

  - name: Set offline-install flag
    ansible.builtin.set_fact:
      wazuh_local_use_offline: >-
        {{
          (wazuh_offline_dir.stat.exists | default(false))
          and ((wazuh_offline_debs.files | default([]) | length) > 0)
        }}

  - name: Assert case-management packages must never be installed
    ansible.builtin.shell: |
      set -e
      if dpkg -l 2>/dev/null | grep -qiE 'thehive|cortex|shuffle'; then
        echo "FORBIDDEN: case/SOAR packages present on appliance" >&2
        exit 1
      fi
      echo OK
    args:
      executable: /bin/bash
    changed_when: false
    when: wazuh_local_forbid_case_packages | bool

  - name: Install common collector packages
    ansible.builtin.apt:
      name:
        - curl
        - gnupg
        - apt-transport-https
        - lsb-release
      state: present
      update_cache: true

  - name: Install engine packages from offline ISO pool (airgap)
    ansible.builtin.shell: |
      set -euo pipefail
      POOL="{{ wazuh_local_offline_pool }}"
      shopt -s nullglob
      # Shared offline pool also holds container/scan debs — install only SIEM/NDR engines.
      # Never install zeek-lts_*.deb meta (needs -dev/-client not shipped in ISO pool).
      debs=(
        "$POOL"/wazuh-manager_*.deb
        "$POOL"/fluent-bit_*.deb
        "$POOL"/suricata_*.deb
        "$POOL"/suricata-update_*.deb
        "$POOL"/zeek-lts-core_*.deb
        "$POOL"/zeekctl-lts_*.deb
      )
      cnt=0
      for _ in "${debs[@]}"; do cnt=$((cnt + 1)); done
      if [ "$cnt" -eq 0 ]; then
        echo "No SIEM/NDR engine debs in $POOL" >&2
        exit 3
      fi
      apt-get install -y --no-install-recommends "${debs[@]}"
    args:
      executable: /bin/bash
    when: wazuh_local_use_offline | bool
    register: wazuh_offline_install

  - name: Add Wazuh APT key
    ansible.builtin.shell: |
      set -euo pipefail
      curl -fsSL "{{ wazuh_local_repo_key_url }}" | gpg --dearmor -o /usr/share/keyrings/wazuh.gpg
      chmod 644 /usr/share/keyrings/wazuh.gpg
    args:
      creates: /usr/share/keyrings/wazuh.gpg
    when:
      - not (wazuh_local_use_offline | bool)
      - wazuh_local_install_manager | bool

  - name: Add Wazuh APT repository
    ansible.builtin.copy:
      dest: /etc/apt/sources.list.d/wazuh.list
      mode: "0644"
      content: |
        deb [signed-by=/usr/share/keyrings/wazuh.gpg] {{ wazuh_local_repo_url }} stable main
    when:
      - not (wazuh_local_use_offline | bool)
      - wazuh_local_install_manager | bool

  - name: Install wazuh-manager from network (idle until license)
    ansible.builtin.apt:
      name: "wazuh-manager={{ wazuh_local_manager_deb_version }}"
      state: present
      update_cache: true
    when:
      - not (wazuh_local_use_offline | bool)
      - wazuh_local_install_manager | bool
    register: wazuh_mgr_install
    failed_when: false

  - name: Note when wazuh-manager package missing
    ansible.builtin.debug:
      msg: >-
        wazuh-manager not installed — populate kevantic-appliance/iso/offline-packages/
        with b2_fetch_offline_packages.sh and rebuild the install ISO, or allow bootstrap
        network so APT can reach packages.wazuh.com.
    when:
      - not (wazuh_local_use_offline | bool)
      - wazuh_local_install_manager | bool
      - wazuh_mgr_install is defined
      - not (wazuh_mgr_install is changed or (wazuh_mgr_install is succeeded))

  - name: Stop and disable wazuh-manager until entitlement
    ansible.builtin.systemd:
      name: wazuh-manager
      state: stopped
      enabled: false
    failed_when: false
    when: wazuh_local_install_manager | bool

  - name: Install local-agent inventory helper (heartbeat → control plane Assets)
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/../../scripts/kevantic-list-local-agents"
      dest: /usr/bin/kevantic-list-local-agents
      mode: "0755"
      owner: root
      group: root
    failed_when: false

  - name: Add Fluent Bit APT keyring (Treasure Data / Fluent Bit)
    ansible.builtin.shell: |
      set -euo pipefail
      curl -fsSL https://packages.fluentbit.io/fluentbit.key | gpg --dearmor -o /usr/share/keyrings/fluentbit.gpg
      chmod 644 /usr/share/keyrings/fluentbit.gpg
    args:
      creates: /usr/share/keyrings/fluentbit.gpg
    when:
      - not (wazuh_local_use_offline | bool)
      - wazuh_local_install_fluent_bit | bool
    failed_when: false

  - name: Add Fluent Bit APT repository
    ansible.builtin.copy:
      dest: /etc/apt/sources.list.d/fluent-bit.list
      mode: "0644"
      content: |
        deb [signed-by=/usr/share/keyrings/fluentbit.gpg] https://packages.fluentbit.io/ubuntu/noble noble main
    when:
      - not (wazuh_local_use_offline | bool)
      - wazuh_local_install_fluent_bit | bool

  - name: Install Fluent Bit from network (appliance-side collector — never on endpoints)
    ansible.builtin.apt:
      name: "{{ fluent_bit_apt_package }}"
      state: present
      update_cache: true
    when:
      - not (wazuh_local_use_offline | bool)
      - wazuh_local_install_fluent_bit | bool
    register: fb_install
    failed_when: false

  - name: Deploy minimal Fluent Bit config (idle)
    ansible.builtin.copy:
      dest: /etc/fluent-bit/fluent-bit.conf
      mode: "0644"
      force: false
      content: |
        [SERVICE]
            Flush        5
            Daemon       Off
            Log_Level    info

        [INPUT]
            Name         syslog
            Mode         udp
            Listen       0.0.0.0
            Port         5140
            Parser       syslog-rfc5424
            Tag          syslog.*

        [OUTPUT]
            Name         file
            Match        *
            Path         /var/log/kevantic
            File         fluent-bit-idle.out
    when: wazuh_local_install_fluent_bit | bool
    failed_when: false

  - name: Stop and disable Fluent Bit until entitlement
    ansible.builtin.systemd:
      name: fluent-bit
      state: stopped
      enabled: false
    failed_when: false
    when: wazuh_local_install_fluent_bit | bool

  - name: Install Suricata from network for NDR idle slot (svc-06)
    ansible.builtin.apt:
      name: suricata
      state: present
      update_cache: true
    when:
      - not (wazuh_local_use_offline | bool)
      - wazuh_local_install_suricata | bool
    register: suri_install
    failed_when: false

  - name: Stop and disable Suricata until entitlement
    ansible.builtin.systemd:
      name: suricata
      state: stopped
      enabled: false
    failed_when: false
    when: wazuh_local_install_suricata | bool

  - name: Ensure service stub directories exist
    ansible.builtin.file:
      path: "/opt/kevantic/services/{{ item }}"
      state: directory
      mode: "0755"
    loop:
      - 01-log-event
      - 02-ir-worker
      - 03-automation
      - 04-vmaas
      - 05-compliance
      - 06-ndr
      - 07-threat-intel
      - 08-forensics
      - 09-easm
      - 10-itdr

  - name: Stage idle engine marker files under /opt/kevantic/services
    ansible.builtin.copy:
      dest: "/opt/kevantic/services/{{ item }}/IDLE"
      mode: "0644"
      content: |
        installed_or_staged=true
        enabled=false
        enable_via=kevantic-cli license apply
        offline_pool={{ wazuh_local_use_offline | default(false) }}
    loop:
      - 01-log-event
      - 02-ir-worker
      - 03-automation
      - 04-vmaas
      - 05-compliance
      - 06-ndr
      - 07-threat-intel
      - 08-forensics
      - 09-easm
      - 10-itdr
