---
# Aggressive Ubuntu Server debloat for Kevantic Appliance (KB-093 B1)
- name: Assert purge list never touches engine/runtime protect set
  ansible.builtin.assert:
    that:
      - (minimize_purge_packages | intersect(minimize_engine_protect_packages) | length) == 0
    fail_msg: >-
      minimize_purge_packages overlaps engine protect list —
      refusing to purge packages required for idle catalogue engines / splash.
    success_msg: "Minimize purge list is engine-safe"
  when: minimize_enabled | bool
  tags: [minimize, safety]

- name: Assert we are not wiping a control-plane host by mistake
  ansible.builtin.assert:
    that:
      - ansible_facts['hostname'] is not search('mssp-control')
      - "'mssp-control' not in (ansible_facts.get('fqdn') | default(''))"
    fail_msg: >-
      Refusing to run minimize on a host that looks like mssp-control.
      Appliance minimize is for appliance images only.
    success_msg: "Hostname OK for appliance minimize"
  when: minimize_enabled | bool
  tags: [minimize, safety]

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  when: minimize_enabled | bool
  tags: [minimize]

- name: Build list of purge candidates that are installed
  ansible.builtin.set_fact:
    minimize_purge_installed: >-
      {{ minimize_purge_packages
         | select('in', ansible_facts.packages)
         | list }}
  when: minimize_enabled | bool
  tags: [minimize]

- name: Purge non-essential packages
  ansible.builtin.apt:
    name: "{{ minimize_purge_installed }}"
    state: absent
    purge: true
    autoremove: true
  when:
    - minimize_enabled | bool
    - minimize_purge_installed | length > 0
  tags: [minimize]

- name: Mask unused systemd units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    masked: true
    daemon_reload: true
  loop: "{{ minimize_mask_units }}"
  failed_when: false
  when: minimize_enabled | bool
  tags: [minimize]

- name: Remove snap directory if present
  ansible.builtin.file:
    path: /snap
    state: absent
  when:
    - minimize_enabled | bool
    - minimize_remove_snap_dir | bool
  tags: [minimize]

- name: Apt autoremove leftover deps
  ansible.builtin.apt:
    autoremove: true
    autoclean: true
  when: minimize_enabled | bool
  tags: [minimize]
