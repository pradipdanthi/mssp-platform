---
# Install kevantic runtime dirs + CLI onto appliance image
- name: Ensure kevantic system group
  ansible.builtin.group:
    name: kevantic
    system: true

# Cloud-init / build VM already has login user "kevantic". Do not usermod an
# active session (system/home/shell changes fail with "currently used by process").
- name: Check whether kevantic user already exists
  ansible.builtin.command: id -u kevantic
  register: kevantic_id
  changed_when: false
  failed_when: false

- name: Create kevantic login user when missing
  ansible.builtin.user:
    name: kevantic
    group: kevantic
    shell: /bin/bash
    home: /home/kevantic
    create_home: true
  when: kevantic_id.rc != 0

- name: Ensure existing kevantic user is in kevantic group
  ansible.builtin.user:
    name: kevantic
    groups: kevantic
    append: true
  when: kevantic_id.rc == 0

- name: Create kevantic directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: kevantic
    mode: "{{ '0750' if 'secrets' in item else '0755' }}"
  loop:
    - /etc/kevantic
    - /etc/niktiar
    - /etc/kevantic/nftables
    - /etc/kevantic/trust
    - /var/lib/kevantic
    - /var/lib/kevantic/secrets
    - /var/lib/kevantic/ota
    - /var/lib/kevantic/wpk
    - /var/log/kevantic
    - /var/log/kevantic/datalake

- name: Install kevantic-cli package tree
  ansible.builtin.copy:
    src: "{{ kevantic_repo_root | default(playbook_dir + '/../..') }}/cli/kevantic-cli/kevantic_cli/"
    dest: /opt/kevantic/cli/kevantic_cli/
    mode: "0644"
    directory_mode: "0755"

- name: Install kevantic-cli wrapper
  ansible.builtin.copy:
    dest: /usr/bin/kevantic-cli
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      export PYTHONPATH=/opt/kevantic/cli${PYTHONPATH:+:$PYTHONPATH}
      exec python3 -m kevantic_cli "$@"

- name: Install appliance engine package tree
  ansible.builtin.copy:
    src: "{{ kevantic_repo_root | default(playbook_dir + '/../..') }}/appliance/"
    dest: /opt/kevantic/appliance-src/appliance/
    mode: "0644"
    directory_mode: "0755"

- name: Install engine requirements file
  ansible.builtin.copy:
    src: "{{ kevantic_repo_root | default(playbook_dir + '/../..') }}/requirements-engine.txt"
    dest: /opt/kevantic/requirements-engine.txt
    mode: "0644"

- name: Ensure open-source attributions directory
  ansible.builtin.file:
    path: /usr/share/doc/kevantic
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install open-source attributions notice (compliance bake)
  ansible.builtin.copy:
    src: "{{ kevantic_repo_root | default(playbook_dir + '/../..') }}/ATTRIBUTIONS.txt"
    dest: /usr/share/doc/kevantic/ATTRIBUTIONS.txt
    mode: "0644"

- name: Ensure pip available for engine deps
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
    state: present
    update_cache: true

- name: Install DuckDB for local Parquet lake (KB-093E)
  ansible.builtin.pip:
    requirements: /opt/kevantic/requirements-engine.txt
    extra_args: --break-system-packages
  # Ubuntu 24.04 PEP 668 — appliance image is dedicated, break-system-packages OK

- name: Install appliance engine module path helper
  ansible.builtin.copy:
    dest: /etc/profile.d/kevantic-appliance-engine.sh
    mode: "0644"
    content: |
      export PYTHONPATH=/opt/kevantic/appliance-src${PYTHONPATH:+:$PYTHONPATH}

- name: Install kevantic-engine-api wrapper
  ansible.builtin.copy:
    dest: /usr/bin/kevantic-engine-api
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      export PYTHONPATH=/opt/kevantic/appliance-src${PYTHONPATH:+:$PYTHONPATH}
      export KEVANTIC_STATE_DIR=${KEVANTIC_STATE_DIR:-/var/lib/kevantic}
      export KEVANTIC_LOG_DIR=${KEVANTIC_LOG_DIR:-/var/log/kevantic}
      exec python3 -m appliance.api.local_app "$@"

- name: Install engine systemd unit
  ansible.builtin.copy:
    src: "{{ kevantic_repo_root | default(playbook_dir + '/../..') }}/configs/systemd/kevantic-appliance-engine.service"
    dest: /etc/systemd/system/kevantic-appliance-engine.service
    mode: "0644"

- name: Install heartbeat service + timer + critical-alert forwarder + Ollama unit
  ansible.builtin.copy:
    src: "{{ kevantic_repo_root | default(playbook_dir + '/../..') }}/configs/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - kevantic-heartbeat.service
    - kevantic-heartbeat.timer
    - niktiar-heartbeat.service
    - niktiar-heartbeat.timer
    - kevantic-license-enforce.service
    - kevantic-license-enforce.timer
    - kevantic-critical-alert-forwarder.service
    - niktiar-critical-alert-forwarder.service
    - ollama.service

- name: Ensure Ollama systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service.d
    state: directory
    mode: "0755"

- name: Install Ollama localhost-only drop-in
  ansible.builtin.copy:
    src: "{{ kevantic_repo_root | default(playbook_dir + '/../..') }}/configs/systemd/ollama.service.d/override.conf"
    dest: /etc/systemd/system/ollama.service.d/override.conf
    mode: "0644"

- name: Install appliance Ollama helper scripts
  ansible.builtin.copy:
    src: "{{ kevantic_repo_root | default(playbook_dir + '/../..') }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { src: "scripts/install_appliance_ollama.sh", dest: "/usr/local/sbin/install_appliance_ollama.sh" }
    - { src: "scripts/pull_local_ai_model.sh", dest: "/usr/local/sbin/pull_local_ai_model.sh" }
    - { src: "configs/systemd/ollama-serve-pinned.sh", dest: "/usr/local/sbin/ollama-serve-pinned.sh" }

- name: Install Ollama env example (lab defaults)
  ansible.builtin.copy:
    src: "{{ kevantic_repo_root | default(playbook_dir + '/../..') }}/configs/kevantic/ollama.env.example"
    dest: /etc/kevantic/ollama.env.example
    mode: "0644"

- name: Assert local AI filter module present in image
  ansible.builtin.stat:
    path: /opt/kevantic/appliance-src/appliance/telemetry/local_ai_filter.py
  register: kevantic_local_ai_mod

- name: Fail provision if local AI filter module missing
  ansible.builtin.assert:
    that:
      - kevantic_local_ai_mod.stat.exists
    fail_msg: >-
      Golden image incomplete: local_ai_filter.py missing under appliance-src.
      Appliance-local AI triage is part of the edge filter path (KB-108).

- name: Install local agent inventory helper (heartbeat metadata)
  ansible.builtin.copy:
    src: "{{ kevantic_repo_root | default(playbook_dir + '/../..') }}/scripts/kevantic-list-local-agents"
    dest: /usr/bin/kevantic-list-local-agents
    mode: "0755"

- name: Symlink branded agent-inventory helper
  ansible.builtin.file:
    src: /usr/bin/kevantic-list-local-agents
    dest: /usr/bin/niktiar-list-local-agents
    state: link
    force: true

- name: Resolve git commit for image-release metadata
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ kevantic_repo_root | default(playbook_dir + '/../..') }}/.."
      - rev-parse
      - --short
      - HEAD
  register: kevantic_image_git
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false

- name: Install image-release metadata (fleet version / git commit)
  ansible.builtin.copy:
    dest: "{{ item }}"
    mode: "0644"
    content: |
      {
        "config_version": "track1",
        "git_commit": "{{ kevantic_image_git.stdout | default('unknown', true) }}"
      }
  loop:
    - /etc/kevantic/image-release.json
    - /etc/niktiar/image-release.json

- name: Assert heartbeat unit invokes Python module (not bash CLI wrapper)
  ansible.builtin.command: grep -F "ExecStart=/usr/bin/python3 -m kevantic_cli heartbeat" /etc/systemd/system/kevantic-heartbeat.service
  changed_when: false

- name: Assert fleet-reporting helpers exist in installed CLI
  ansible.builtin.command: grep -E "_collect_resource_metrics|_read_enabled_services|_read_image_metadata" /opt/kevantic/cli/kevantic_cli/register_ops.py
  changed_when: false

- name: Enable kevantic-appliance-engine (loopback job API)
  ansible.builtin.systemd:
    name: kevantic-appliance-engine.service
    enabled: true
    daemon_reload: true

- name: Enable heartbeat timer (every 60s when registered)
  ansible.builtin.systemd:
    name: kevantic-heartbeat.timer
    enabled: true
    daemon_reload: true
    state: started

- name: Enable license enforce timer (hourly JWS expiry check)
  ansible.builtin.systemd:
    name: kevantic-license-enforce.timer
    enabled: true
    daemon_reload: true
    state: started

- name: Enable critical-alert forwarder in golden image (mandatory for appliance model)
  ansible.builtin.systemd:
    name: kevantic-critical-alert-forwarder.service
    enabled: true
    daemon_reload: true
    # Started at image build / firstboot — waits for alerts.json + registration creds
    state: started

- name: Assert critical-alert watcher module is present in image
  ansible.builtin.stat:
    path: /opt/kevantic/appliance-src/appliance/telemetry/critical_alert_watcher.py
  register: kevantic_forwarder_mod

- name: Fail provision if critical-alert forwarder missing from golden image
  ansible.builtin.assert:
    that:
      - kevantic_forwarder_mod.stat.exists
    fail_msg: >-
      Golden image incomplete: critical_alert_watcher.py missing under appliance-src.
      Appliance model requires local Manager → cloud metadata forwarder (KB-093P).

- name: Seed default network mode bootstrap
  ansible.builtin.copy:
    dest: /var/lib/kevantic/network_mode
    content: "bootstrap\n"
    mode: "0644"
    force: false
