---
license_enforcer_enabled: true
license_enforcer_state_dir: /var/lib/kevantic
license_enforcer_trust_dir: /etc/kevantic/trust
license_enforcer_pubkeys_dir: /etc/kevantic/trust/keys
license_enforcer_entitlements_path: /var/lib/kevantic/entitlements.json
license_enforcer_license_path: /var/lib/kevantic/license.jws
# Source pubkey from payload (ISO) or role files/
license_enforcer_pubkey_src: "{{ kevantic_payload_root | default(kevantic_repo_root | default(playbook_dir + '/../..') + '/licensing') }}/keys/licensing-ed25519-v1.pub"
