# KB-093N Phase N1 — Kevantic immutable appliance (mkosi 20.x / Ubuntu noble)
# Built on factory VM 113 — never on VM 100 / VM 114.

[Distribution]
Distribution=ubuntu
Release=noble
Architecture=x86-64
Repositories=main,universe

[Output]
Format=disk
OutputDirectory=../.cache/mkosi
@Output=Kevantic-Appliance-Immutable
ImageId=kevantic-appliance
@ImageVersion=0.1.0-dev

[Content]
Bootable=yes
Bootloader=systemd-boot
Hostname=kevantic-appliance
Timezone=UTC
Locale=en_US.UTF-8
WithNetwork=yes
Packages=
    linux-image-generic
    systemd
    systemd-boot
    openssh-server
    sudo
    python3
    python3-pip
    python3-venv
    curl
    ca-certificates
    nftables
    jq
    rsync
    dbus
RemovePackages=
    snapd
PackageDirectories=mkosi.packages
WithDocs=no
WithRecommends=no
RootPassword=ChangeMeNow!
Autologin=no

[Host]
ToolsTree=default
# Debian tools tree needs systemd-repart for Format=disk
ToolsTreePackages=systemd
QemuMem=4096M
QemuSmp=2
