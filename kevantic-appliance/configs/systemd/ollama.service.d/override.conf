[Service]
EnvironmentFile=-/etc/kevantic/ollama.env
EnvironmentFile=-/etc/niktiar/ollama.env
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_ORIGINS=http://127.0.0.1,http://localhost"
# ExecStart cleared so pinned wrapper replaces default ollama serve.
ExecStart=
ExecStart=/usr/local/sbin/ollama-serve-pinned.sh
