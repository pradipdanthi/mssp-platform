# MSSP endpoint agent parameters
# Replace placeholders from your tenant onboarding wizard; do not commit real keys.

[Agent]
enrollment_server=<MANAGER_IP>
enrollment_port=1515
manager_address=<MANAGER_IP>
groups=<TENANT_SHORT_CODE>

# Windows: install-windows-agent.ps1 auto-runs Enable-MsspWindowsTelemetry.ps1
# (Sysmon baseline + process creation auditing + agent localfile channels).
# Linux/macOS: enable endpoint-telemetry-pack.conf (process, FIM, network sockets)
