---
# Full provision used by ISO firstboot (and factory rebuilds).
# TheHive / Shuffle must never appear on the appliance.
- name: Junexis appliance install provision
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: minimize
    - role: harden_cis
    - role: firewall_nftables
      vars:
        firewall_nftables_mode: "{{ firewall_nftables_mode | default('bootstrap') }}"
    - role: apparmor_profiles
    - role: auditd
    - role: container_runtime
    - role: junexis_runtime
    - role: channel_agent
    - role: license_enforcer
    - role: wazuh_local
    - role: ota_staging
    - role: service_manager
  post_tasks:
    - name: Assert case-management / SOAR packages absent
      ansible.builtin.shell: |
        set -e
        if dpkg -l 2>/dev/null | grep -qiE 'thehive|cortex|shuffle'; then
          echo "FORBIDDEN packages on appliance" >&2
          exit 1
        fi
        echo OK
      args:
        executable: /bin/bash
      changed_when: false
