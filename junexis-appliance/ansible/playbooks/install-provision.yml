---
# Full provision used by ISO firstboot (and factory rebuilds).
# TheHive / Shuffle must never appear on the appliance.
- name: Junexis appliance install provision
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: minimize
    - role: boot_splash
    - role: harden_cis
    - role: firewall_nftables
      vars:
        firewall_nftables_mode: "{{ firewall_nftables_mode | default('bootstrap') }}"
    - role: apparmor_profiles
    - role: auditd
    - role: container_runtime
    - role: junexis_runtime
    - role: channel_agent
    - role: license_enforcer
    - role: wazuh_local
    - role: catalogue_engines
    - role: ota_staging
    - role: service_manager
  post_tasks:
    - name: Assert case-management / SOAR packages absent
      ansible.builtin.shell: |
        set -e
        if dpkg -l 2>/dev/null | grep -qiE 'thehive|cortex|shuffle'; then
          echo "FORBIDDEN packages on appliance" >&2
          exit 1
        fi
        echo OK
      args:
        executable: /bin/bash
      changed_when: false

    - name: Assert idle catalogue engine worker present
      ansible.builtin.stat:
        path: /usr/bin/junexis-engine-worker
      register: junexis_engine_worker

    - name: Fail if catalogue engine worker missing
      ansible.builtin.assert:
        that:
          - junexis_engine_worker.stat.exists
        fail_msg: "junexis-engine-worker missing — catalogue engines not provisioned"

    - name: Assert boot splash theme installed
      ansible.builtin.stat:
        path: /usr/share/plymouth/themes/junexis/junexis-boot.png
      register: junexis_splash_png

    - name: Fail if splash artwork missing after boot_splash role
      ansible.builtin.assert:
        that:
          - junexis_splash_png.stat.exists
        fail_msg: "Junexis boot splash PNG missing after provision"
