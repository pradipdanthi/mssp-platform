---
service_manager_enabled: true
service_manager_units_dir: /etc/systemd/system
service_manager_state_dir: /var/lib/junexis
service_manager_entitlements_path: /var/lib/junexis/entitlements.json
# Map service catalogue IDs → systemd units (idle until entitled)
service_manager_catalog:
  svc-01:
    - wazuh-manager
    - fluent-bit
    - junexis-svc-01-log-event.service
  svc-02:
    - junexis-svc-02-ir-worker.service
  svc-03:
    - junexis-svc-03-automation.service
  svc-04:
    - junexis-svc-04-vmaas.service
  svc-05:
    - junexis-svc-05-compliance.service
  svc-06:
    - suricata
    - junexis-svc-06-ndr.service
  svc-07:
    - junexis-svc-07-threat-intel.service
  svc-08:
    - junexis-svc-08-forensics.service
  svc-09:
    - junexis-svc-09-easm.service
  svc-10:
    - junexis-svc-10-itdr.service
