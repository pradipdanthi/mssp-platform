---
apparmor_profiles_enabled: true
apparmor_packages:
  - apparmor
  - apparmor-utils
apparmor_offline_pool: "{{ (junexis_payload_root | default('/opt/junexis/payload')) ~ '/offline-packages' }}"
apparmor_profile_src_dir: "{{ playbook_dir }}/../../hardening/apparmor"
# One path-attached profile for junexis-cli (covers heartbeat timer invocations)
apparmor_profiles:
  - usr.bin.junexis-cli
apparmor_mode: enforce
