---
# Install junexis runtime dirs + CLI onto appliance image
- name: Ensure junexis system group
  ansible.builtin.group:
    name: junexis
    system: true

# Cloud-init / build VM already has login user "junexis". Do not usermod an
# active session (system/home/shell changes fail with "currently used by process").
- name: Check whether junexis user already exists
  ansible.builtin.command: id -u junexis
  register: junexis_id
  changed_when: false
  failed_when: false

- name: Create junexis login user when missing
  ansible.builtin.user:
    name: junexis
    group: junexis
    shell: /bin/bash
    home: /home/junexis
    create_home: true
  when: junexis_id.rc != 0

- name: Ensure existing junexis user is in junexis group
  ansible.builtin.user:
    name: junexis
    groups: junexis
    append: true
  when: junexis_id.rc == 0

- name: Create junexis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: junexis
    mode: "{{ '0750' if 'secrets' in item else '0755' }}"
  loop:
    - /etc/junexis
    - /etc/junexis/nftables
    - /etc/junexis/trust
    - /var/lib/junexis
    - /var/lib/junexis/secrets
    - /var/lib/junexis/ota
    - /var/lib/junexis/wpk
    - /var/log/junexis
    - /var/log/junexis/datalake

- name: Install junexis-cli package tree
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../cli/junexis-cli/junexis_cli/"
    dest: /opt/junexis/cli/junexis_cli/
    mode: "0644"
    directory_mode: "0755"

- name: Install junexis-cli wrapper
  ansible.builtin.copy:
    dest: /usr/bin/junexis-cli
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      export PYTHONPATH=/opt/junexis/cli${PYTHONPATH:+:$PYTHONPATH}
      exec python3 -m junexis_cli "$@"

- name: Install appliance engine package tree
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../appliance/"
    dest: /opt/junexis/appliance-src/appliance/
    mode: "0644"
    directory_mode: "0755"

- name: Install engine requirements file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../requirements-engine.txt"
    dest: /opt/junexis/requirements-engine.txt
    mode: "0644"

- name: Ensure pip available for engine deps
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
    state: present
    update_cache: true

- name: Install DuckDB for local Parquet lake (KB-093E)
  ansible.builtin.pip:
    requirements: /opt/junexis/requirements-engine.txt
    extra_args: --break-system-packages
  # Ubuntu 24.04 PEP 668 — appliance image is dedicated, break-system-packages OK

- name: Install appliance engine module path helper
  ansible.builtin.copy:
    dest: /etc/profile.d/junexis-appliance-engine.sh
    mode: "0644"
    content: |
      export PYTHONPATH=/opt/junexis/appliance-src${PYTHONPATH:+:$PYTHONPATH}

- name: Install junexis-engine-api wrapper
  ansible.builtin.copy:
    dest: /usr/bin/junexis-engine-api
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      export PYTHONPATH=/opt/junexis/appliance-src${PYTHONPATH:+:$PYTHONPATH}
      export JUNEXIS_STATE_DIR=${JUNEXIS_STATE_DIR:-/var/lib/junexis}
      export JUNEXIS_LOG_DIR=${JUNEXIS_LOG_DIR:-/var/log/junexis}
      exec python3 -m appliance.api.local_app "$@"

- name: Install engine systemd unit
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../configs/systemd/junexis-appliance-engine.service"
    dest: /etc/systemd/system/junexis-appliance-engine.service
    mode: "0644"

- name: Install heartbeat service + timer (Phase A bridge)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../configs/systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - junexis-heartbeat.service
    - junexis-heartbeat.timer

- name: Enable junexis-appliance-engine (loopback job API)
  ansible.builtin.systemd:
    name: junexis-appliance-engine.service
    enabled: true
    daemon_reload: true

- name: Enable heartbeat timer (every 60s when registered)
  ansible.builtin.systemd:
    name: junexis-heartbeat.timer
    enabled: true
    daemon_reload: true
    state: started

- name: Seed default network mode bootstrap
  ansible.builtin.copy:
    dest: /var/lib/junexis/network_mode
    content: "bootstrap\n"
    mode: "0644"
    force: false
