---
# Install junexis runtime dirs + CLI onto appliance image
- name: Ensure junexis system group
  ansible.builtin.group:
    name: junexis
    system: true

- name: Ensure junexis system user
  ansible.builtin.user:
    name: junexis
    group: junexis
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/junexis
    create_home: false

- name: Create junexis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: junexis
    mode: "{{ '0750' if 'secrets' in item else '0755' }}"
  loop:
    - /etc/junexis
    - /etc/junexis/nftables
    - /etc/junexis/trust
    - /var/lib/junexis
    - /var/lib/junexis/secrets
    - /var/lib/junexis/ota
    - /var/lib/junexis/wpk
    - /var/log/junexis
    - /var/log/junexis/datalake

- name: Install junexis-cli package tree
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../cli/junexis-cli/junexis_cli/"
    dest: /opt/junexis/cli/junexis_cli/
    mode: "0644"
    directory_mode: "0755"

- name: Install junexis-cli wrapper
  ansible.builtin.copy:
    dest: /usr/bin/junexis-cli
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      export PYTHONPATH=/opt/junexis/cli${PYTHONPATH:+:$PYTHONPATH}
      exec python3 -m junexis_cli "$@"

- name: Install appliance engine package tree
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../appliance/"
    dest: /opt/junexis/appliance-src/appliance/
    mode: "0644"
    directory_mode: "0755"

- name: Install engine requirements marker
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../requirements-engine.txt"
    dest: /opt/junexis/requirements-engine.txt
    mode: "0644"

- name: Seed default network mode bootstrap
  ansible.builtin.copy:
    dest: /var/lib/junexis/network_mode
    content: "bootstrap\n"
    mode: "0644"
    force: false
