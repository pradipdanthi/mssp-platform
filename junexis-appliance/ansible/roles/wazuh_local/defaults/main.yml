---
wazuh_local_enabled: true
# Install Manager + Fluent Bit then leave them stopped until license reconcile
wazuh_local_install_manager: true
wazuh_local_install_fluent_bit: true
wazuh_local_install_suricata: "{{ junexis_install_idle_engines | default(true) | bool }}"
# Prefer ISO offline pool when present (firstboot copies payload to /opt/junexis/payload)
wazuh_local_offline_packages_dir: ""
# Align with VM 101 when network fallback is used
wazuh_local_manager_version: "4.14.6"
wazuh_local_manager_deb_version: "4.14.6-1"
wazuh_local_repo_key_url: "https://packages.wazuh.com/key/GPG-KEY-WAZUH"
wazuh_local_repo_url: "https://packages.wazuh.com/4.x/apt/"
fluent_bit_apt_package: fluent-bit
# Never install TheHive / Shuffle
wazuh_local_forbid_case_packages: true
