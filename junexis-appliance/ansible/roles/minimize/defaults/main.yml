---
# Defaults for role minimize
minimize_enabled: true

# Packages to purge when present (idempotent — ignore if absent)
minimize_purge_packages:
  - snapd
  - cloud-init
  - cloud-guest-utils
  - cloud-initramfs-copymods
  - cloud-initramfs-dyn-netconf
  - cups
  - cups-browsed
  - cups-client
  - cups-common
  - cups-core-drivers
  - cups-daemon
  - cups-filters
  - cups-ppdc
  - cups-server-common
  - modemmanager
  - bluez
  - bluez-obexd
  - popularity-contest
  - update-notifier-common
  - ubuntu-advantage-tools
  - multipath-tools
  - open-iscsi
  - landscape-common
  - plymouth
  - plymouth-theme-ubuntu-text

# Units to mask (do not disable critical networkd/ssh)
minimize_mask_units:
  - snapd.service
  - snapd.socket
  - snapd.seeded.service
  - cloud-init.service
  - cloud-init-local.service
  - cloud-config.service
  - cloud-final.service
  - ModemManager.service
  - bluetooth.service
  - cups.service
  - cups-browsed.service
  - multipathd.service
  - open-iscsi.service
  - iscsid.service
  - apport.service
  - whoopsie.service

minimize_remove_snap_dir: true
