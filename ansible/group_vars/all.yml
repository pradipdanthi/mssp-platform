# KB-039: Placeholder group variables — NO SECRETS IN GIT
---
mssp_project_root: /opt/mssp-control
mssp_control_plane_url: "http://192.168.0.201:8000"

# Placeholder — set via Ansible Vault or runtime -e at deploy time
ansible_user_placeholder: "<SET_VIA_VAULT_OR_ENV>"
ssh_private_key_path_placeholder: "<SET_VIA_VAULT_OR_ENV>"

# Wazuh KB-041 public configuration — no credentials
wazuh_version: "4.14.6"
wazuh_repository_major_minor: "4.14"
wazuh_execution_mode: "preflight"
wazuh_live_install_approved: false

# Integrity value required only after a separate live-deployment approval.
# Verify it out-of-band against the exact official installer immediately
# before deployment; do not bypass the role's 64-hex-character assertion.
wazuh_install_assistant_sha256: "<SET_VERIFIED_SHA256_BEFORE_DEPLOYMENT>"

# Admin-only URLs, never customer API
wazuh_manager_url_placeholder: "<SET_AT_DEPLOY_TIME>"
wazuh_indexer_url_placeholder: "<SET_AT_DEPLOY_TIME>"
wazuh_dashboard_url_placeholder: "<SET_AT_DEPLOY_TIME>"

# Cluster registry alignment (KB-037)
soc_cluster_code_placeholder: "SOC-LAB-01"

# Tenant deployment mode awareness (KB-038) — routing enforced in control plane
default_deployment_mode: cloud

# Customer safety reminder for playbook authors
customer_portal_raw_logs_policy: never
