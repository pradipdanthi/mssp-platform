---
# KB-042: Wazuh agent onboarding — Linux.
# Safe default is preflight only. Live enrollment requires separate approval
# and a Vault-supplied enrollment secret — no secrets in Git.
# Manager address: wazuh_manager_ip from inventory (wazuh_stack ansible_host).

- name: KB-042 Wazuh Linux agent preflight or enrollment
  hosts: linux-endpoint-lab
  gather_facts: true
  become: true
  any_errors_fatal: true
  roles:
    - role: wazuh_agent
