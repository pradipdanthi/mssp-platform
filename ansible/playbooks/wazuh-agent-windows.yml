---
# KB-042: Wazuh agent onboarding — Windows.
# Manager address comes from inventory (wazuh_stack ansible_host), never a lab IP.
# Enrollment key via Ansible Vault — no secrets in Git.
# Safe default is preflight. Live enroll requires wazuh_agent_live_enroll_approved.

- name: Wazuh agent install — Windows
  hosts: windows-endpoint-lab
  gather_facts: false
  vars:
    wazuh_agent_windows_stub_mode: true
    wazuh_manager_ip: "{{ hostvars[groups['wazuh_stack'][0]]['ansible_host'] }}"
    wazuh_agent_execution_mode: "preflight"
    wazuh_agent_live_enroll_approved: false
  tasks:
    - name: Require inventory-driven Manager address
      ansible.builtin.assert:
        that:
          - wazuh_manager_ip is defined
          - (wazuh_manager_ip | string | length) > 0
        fail_msg: wazuh_manager_ip must resolve from inventory group wazuh_stack.

    - name: "Step 1 — Install Wazuh agent MSI (preflight)"
      ansible.builtin.debug:
        msg: "Deferred until live enroll: Install wazuh-agent MSI via win_package."

    - name: "Step 2 — Configure manager address from inventory"
      ansible.builtin.debug:
        msg: "WAZUH_MANAGER={{ wazuh_manager_ip }} — enrollment secret from Vault."

    - name: "Step 3 — Register and start agent service (preflight)"
      ansible.builtin.debug:
        msg: "Deferred until live enroll: Enrollment with auth key from Vault; start WazuhSvc."

    - name: "Step 4 — Verify agent in manager (preflight)"
      ansible.builtin.debug:
        msg: "Deferred until live enroll: Confirm agent ID in Manager — admin API only."

    - name: Explain Windows safety gate
      ansible.builtin.debug:
        msg: >-
          Windows agent playbook stays preflight until the inventory host
          windows-endpoint-lab exists and wazuh_agent_live_enroll_approved=true.
