---
# KB-044: Suricata → Wazuh integration — VM 106 (suricata-sensor).
# Safe default is preflight only. Live enrollment requires separate approval.
# Option A: Wazuh agent on sensor tails eve.json → Manager VM 101.
# No secrets in Git. Customer portal never receives raw Suricata logs.

- name: KB-044 Suricata to Wazuh preflight or enrollment
  hosts: suricata-sensor
  gather_facts: true
  become: true
  any_errors_fatal: true
  roles:
    - role: suricata_wazuh

- name: MSSP NDR Suricata severity rules on Wazuh Manager
  hosts: wazuh_stack
  gather_facts: false
  become: true
  tasks:
    - name: Install Suricata severity rules (100610-100612)
      ansible.builtin.copy:
        src: ../roles/suricata_wazuh/files/mssp_suricata_rules.xml
        dest: /var/ossec/etc/rules/mssp_suricata_rules.xml
        owner: root
        group: wazuh
        mode: "0660"
      notify: Restart wazuh-manager
  handlers:
    - name: Restart wazuh-manager
      ansible.builtin.command:
        argv: [timeout, "60", /var/ossec/bin/wazuh-control, restart]
