---
# KB-042: Safe defaults for Wazuh agent onboarding.
# Defaults are preflight-only. Live enrollment requires explicit approval.
# Never place enrollment secrets in Git.

wazuh_agent_version: "4.14.6"
wazuh_agent_package_version: "4.14.6-1"
wazuh_repository_major_minor: "4.14"
wazuh_agent_execution_mode: "preflight"
wazuh_agent_live_enroll_approved: false

# Public manager address for lab agents (cloud/hybrid). Not a secret.
wazuh_manager_address: "192.168.0.211"
wazuh_manager_port: 1514
wazuh_manager_enrollment_port: 1515
wazuh_agent_name: "linux-endpoint-lab"

# Manager authd currently has <use_password>no</use_password>.
# Keep this true only while that remains verified on VM 101.
wazuh_agent_authd_passwordless: true

# Optional enrollment password — required only when passwordless is false.
# Supply via Vault / runtime -e; never commit a real value.
wazuh_agent_enrollment_password: "<SET_VIA_VAULT_OR_ENV>"

wazuh_agent_apt_keyring: /usr/share/keyrings/wazuh.gpg
wazuh_agent_apt_list: /etc/apt/sources.list.d/wazuh.list
wazuh_agent_gpg_key_url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
wazuh_agent_repo_url: "https://packages.wazuh.com/4.x/apt/"

wazuh_agent_supported_linux_distributions:
  - Ubuntu
wazuh_agent_supported_ubuntu_releases:
  - "22.04"
  - "24.04"
wazuh_agent_minimum_memory_mb: 1024
wazuh_agent_minimum_root_disk_gb: 20

wazuh_agent_state_directory: /var/lib/mssp/wazuh-agent
wazuh_agent_install_marker: "{{ wazuh_agent_state_directory }}/{{ wazuh_agent_version }}.enrolled"
