---
- name: Validate KB-041 execution controls
  ansible.builtin.assert:
    that:
      - wazuh_execution_mode in ["preflight", "install", "validate"]
    fail_msg: >-
      wazuh_execution_mode must be preflight, install, or validate.
      The safe default is preflight.

- name: Validate Wazuh inventory identity
  ansible.builtin.assert:
    that:
      - deployment_role == "wazuh_cluster"
      - ansible_host is defined
      - (ansible_host | string | length) > 0
    fail_msg: >-
      wazuh_stack requires deployment_role=wazuh_cluster and ansible_host from inventory.

- name: Validate supported operating system and architecture
  ansible.builtin.assert:
    that:
      - ansible_distribution in wazuh_supported_distributions
      - ansible_distribution_version in wazuh_supported_ubuntu_releases
      - ansible_architecture in wazuh_supported_architectures
      - (ansible_processor_vcpus | int) >= (wazuh_minimum_vcpus | int)
      - (ansible_memtotal_mb | int) >= (wazuh_minimum_memory_mb | int)
    fail_msg: >-
      Wazuh Manager host must use an approved Ubuntu release/architecture and have at
      least {{ wazuh_minimum_vcpus }} vCPUs and
      {{ wazuh_minimum_memory_mb }} MB RAM.

- name: Resolve root filesystem size
  ansible.builtin.set_fact:
    wazuh_root_disk_bytes: >-
      {{
        (
          ansible_mounts
          | selectattr("mount", "equalto", "/")
          | map(attribute="size_total")
          | first
        )
        | int
      }}
    wazuh_root_available_bytes: >-
      {{
        (
          ansible_mounts
          | selectattr("mount", "equalto", "/")
          | map(attribute="size_available")
          | first
        )
        | int
      }}

- name: Validate minimum root filesystem size
  ansible.builtin.assert:
    that:
      - (wazuh_root_disk_bytes | int) >= ((wazuh_minimum_root_disk_gb | int) * 1024 * 1024 * 1024)
    fail_msg: >-
      VM 101 requires at least {{ wazuh_minimum_root_disk_gb }} GB on the
      root filesystem for this lab installation.

- name: Validate minimum available root filesystem space
  ansible.builtin.assert:
    that:
      - >-
        (wazuh_root_available_bytes | int) >=
        ((wazuh_minimum_root_available_gb | int) * 1024 * 1024 * 1024)
    fail_msg: >-
      VM 101 requires at least {{ wazuh_minimum_root_available_gb }} GB free
      on the root filesystem before Wazuh installation.
  when: wazuh_execution_mode == "preflight"

- name: Check whether VM 101 requires a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: wazuh_reboot_required
  when: wazuh_execution_mode == "preflight"

- name: Require a reboot-clean VM before installation
  ansible.builtin.assert:
    that:
      - not wazuh_reboot_required.stat.exists
    fail_msg: >-
      VM 101 has a pending reboot. Reboot and rerun preflight before
      installation.
  when: wazuh_execution_mode == "preflight"

- name: Download official installer bytes for integrity preflight
  ansible.builtin.uri:
    url: "{{ wazuh_install_assistant_url }}"
    method: GET
    return_content: true
    status_code: 200
    timeout: 30
    validate_certs: true
  register: wazuh_installer_preflight
  changed_when: false
  check_mode: false
  no_log: true
  when: wazuh_execution_mode == "preflight"

- name: Verify official installer checksum from VM 101
  ansible.builtin.assert:
    that:
      - >-
        (wazuh_installer_preflight.content | hash("sha256")) ==
        wazuh_install_assistant_sha256
    fail_msg: >-
      The official installer bytes no longer match the approved SHA-256.
      Stop and review the upstream change before installation.
  no_log: true
  when: wazuh_execution_mode == "preflight"

- name: Check current listening TCP ports
  ansible.builtin.command:
    argv:
      - ss
      - -H
      - -lnt
  register: wazuh_listening_ports
  changed_when: false
  failed_when: false
  check_mode: false
  when: wazuh_execution_mode == "preflight"

- name: Verify Wazuh TCP ports are available
  ansible.builtin.assert:
    that:
      - >-
        (
          wazuh_listening_ports.stdout
          | regex_search(':(443|1514|1515|55000|9200)(\\s|$)')
        ) is none
    fail_msg: >-
      One or more required Wazuh TCP ports are already listening on VM 101.
      Resolve the conflict before approving installation.
  when: wazuh_execution_mode == "preflight"

- name: Explain the preflight-only result
  ansible.builtin.debug:
    msg: >-
      KB-041 preflight passed for VM 101. No packages were installed.
      A separate approval is required before setting
      wazuh_execution_mode=install and wazuh_live_install_approved=true.
  when: wazuh_execution_mode == "preflight"

- name: Check installation marker
  ansible.builtin.stat:
    path: "{{ wazuh_install_marker }}"
  register: wazuh_marker

- name: Install Wazuh central components
  when:
    - wazuh_execution_mode == "install"
    - not wazuh_marker.stat.exists
  block:
    - name: Enforce explicit live-install approval and installer integrity
      ansible.builtin.assert:
        that:
          - wazuh_live_install_approved | bool
          - wazuh_install_assistant_sha256 is match("^[A-Fa-f0-9]{64}$")
        fail_msg: >-
          Live installation is blocked. Explicitly approve the change and
          provide the verified 64-character installer SHA-256 digest.

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - tar
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create restricted Wazuh installation directory
      ansible.builtin.file:
        path: "{{ wazuh_install_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Download the official Wazuh installation assistant
      ansible.builtin.get_url:
        url: "{{ wazuh_install_assistant_url }}"
        dest: "{{ wazuh_install_directory }}/wazuh-install.sh"
        owner: root
        group: root
        mode: "0700"
        checksum: "sha256:{{ wazuh_install_assistant_sha256 }}"

    - name: Run the Wazuh all-in-one installation assistant
      ansible.builtin.command:
        argv:
          - bash
          - ./wazuh-install.sh
          - -a
        chdir: "{{ wazuh_install_directory }}"
      register: wazuh_install_result
      changed_when: true
      no_log: true

    - name: Verify the generated credential archive exists
      ansible.builtin.stat:
        path: "{{ wazuh_install_credentials_archive }}"
      register: wazuh_credentials_archive
      no_log: true

    - name: Require generated credentials to remain on VM 101
      ansible.builtin.assert:
        that:
          - wazuh_credentials_archive.stat.exists
          - wazuh_credentials_archive.stat.isreg
        fail_msg: >-
          The Wazuh credential archive was not created at the expected
          root-only path. Stop and investigate without exposing installer
          output.
      no_log: true

    - name: Restrict the generated credential archive
      ansible.builtin.file:
        path: "{{ wazuh_install_credentials_archive }}"
        state: file
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Disable the Wazuh APT repository after installation
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/wazuh.list
        regexp: '^deb '
        replace: '#deb '
      notify: Refresh APT cache

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
  when: wazuh_execution_mode in ["install", "validate"]

- name: Verify exact Wazuh package versions
  ansible.builtin.assert:
    that:
      - "'wazuh-manager' in ansible_facts.packages"
      - "'wazuh-indexer' in ansible_facts.packages"
      - "'wazuh-dashboard' in ansible_facts.packages"
      - ansible_facts.packages["wazuh-manager"][0].version is match("^" ~ wazuh_version ~ "([.-]|$)")
      - ansible_facts.packages["wazuh-indexer"][0].version is match("^" ~ wazuh_version ~ "([.-]|$)")
      - ansible_facts.packages["wazuh-dashboard"][0].version is match("^" ~ wazuh_version ~ "([.-]|$)")
    fail_msg: "Installed Wazuh packages do not match pinned version {{ wazuh_version }}."
  when: wazuh_execution_mode in ["install", "validate"]

- name: Gather service facts
  ansible.builtin.service_facts:
  when: wazuh_execution_mode in ["install", "validate"]

- name: Verify expected Wazuh services are running
  ansible.builtin.assert:
    that:
      - (item ~ ".service") in ansible_facts.services
      - ansible_facts.services[item ~ ".service"].state == "running"
    fail_msg: "Expected service {{ item }} is not installed and running."
  loop: "{{ wazuh_expected_services }}"
  when: wazuh_execution_mode in ["install", "validate"]

- name: Verify expected Wazuh listeners locally
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ item }}"
    state: started
    timeout: 5
  loop: "{{ wazuh_expected_tcp_ports }}"
  when: wazuh_execution_mode in ["install", "validate"]

- name: Create restricted MSSP state directory
  ansible.builtin.file:
    path: "{{ wazuh_state_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: wazuh_execution_mode == "install"

- name: Record successful pinned-version installation
  ansible.builtin.copy:
    content: "Wazuh {{ wazuh_version }} validated by KB-041 automation.\n"
    dest: "{{ wazuh_install_marker }}"
    owner: root
    group: root
    mode: "0600"
  when: wazuh_execution_mode == "install"
