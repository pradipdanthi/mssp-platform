---
# KB-047/048/049: TheHive + Shuffle co-located on VM 102 (thehive_shuffle).
# Targets only deployment_role case_soar. No secrets in Git.

- name: Validate case-soar execution controls
  ansible.builtin.assert:
    that:
      - case_soar_execution_mode in ["preflight", "install", "validate"]
    fail_msg: >-
      case_soar_execution_mode must be preflight, install, or validate.
      The safe default is preflight.

- name: Validate inventory identity
  ansible.builtin.assert:
    that:
      - deployment_role == "case_soar"
      - ansible_host is defined
      - (ansible_host | string | length) > 0
    fail_msg: case_soar requires deployment_role=case_soar and ansible_host from inventory.

- name: Validate supported OS and resources
  ansible.builtin.assert:
    that:
      - ansible_distribution in case_soar_supported_linux_distributions
      - ansible_distribution_version in case_soar_supported_ubuntu_releases
      - (ansible_memtotal_mb | int) >= (case_soar_minimum_memory_mb | int)
      - (ansible_processor_vcpus | int) >= (case_soar_minimum_vcpus | int)
    fail_msg: >-
      Case/SOAR host must use approved Ubuntu with at least
      {{ case_soar_minimum_memory_mb }} MB RAM and
      {{ case_soar_minimum_vcpus }} vCPUs.

- name: Resolve root filesystem size
  ansible.builtin.set_fact:
    case_soar_root_disk_bytes: >-
      {{
        (
          ansible_mounts
          | selectattr("mount", "equalto", "/")
          | map(attribute="size_total")
          | first
        )
        | int
      }}

- name: Validate minimum root filesystem size
  ansible.builtin.assert:
    that:
      - >-
        (case_soar_root_disk_bytes | int) >=
        ((case_soar_minimum_root_disk_gb | int) * 1024 * 1024 * 1024)
    fail_msg: >-
      VM 102 requires at least {{ case_soar_minimum_root_disk_gb }} GB on
      the root filesystem.

- name: Explain the preflight-only result
  ansible.builtin.debug:
    msg: >-
      Case-soar preflight passed for VM 102 (thehive_shuffle). No packages
      were installed. Approve live install with
      case_soar_execution_mode=install and
      case_soar_live_install_approved=true.
  when: case_soar_execution_mode == "preflight"

- name: Check install marker
  ansible.builtin.stat:
    path: "{{ case_soar_install_marker }}"
  register: case_soar_marker

- name: Install Docker and deploy TheHive + Shuffle (lean lab)
  when:
    - case_soar_execution_mode == "install"
    - not case_soar_marker.stat.exists
  block:
    - name: Enforce explicit live-install approval
      ansible.builtin.assert:
        that:
          - case_soar_live_install_approved | bool
        fail_msg: >-
          Live case-soar install is blocked until
          case_soar_live_install_approved=true.

    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - jq
          - git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Docker APT keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        validate_certs: true

    - name: Add Docker APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"
        content: >
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable Docker service
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Raise vm.max_map_count for OpenSearch/Elasticsearch
      ansible.builtin.command:
        argv:
          - sysctl
          - -w
          - vm.max_map_count=262144
      changed_when: true

    - name: Persist vm.max_map_count
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-mssp-case-soar.conf
        mode: "0644"
        content: |
          vm.max_map_count=262144


    - name: Create install directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ case_soar_install_root }}"
        - "{{ case_soar_thehive_dir }}"
        - "{{ case_soar_shuffle_dir }}"
        - "{{ case_soar_state_directory }}"

    - name: Check for existing TheHive secret env file
      ansible.builtin.stat:
        path: "{{ case_soar_thehive_dir }}/thehive.secret.env"
      register: case_soar_thehive_secret_stat

    - name: Create TheHive secret env file (once)
      ansible.builtin.copy:
        dest: "{{ case_soar_thehive_dir }}/thehive.secret.env"
        mode: "0600"
        owner: root
        group: root
        content: |
          TH_SECRET={{ lookup('password', '/dev/null length=64 chars=ascii_letters,digits') }}
      when: not case_soar_thehive_secret_stat.stat.exists
      no_log: true

    - name: Write TheHive lean compose stack
      ansible.builtin.copy:
        dest: "{{ case_soar_thehive_dir }}/docker-compose.yml"
        mode: "0640"
        content: |
          # MSSP lab — TheHive 4 lean stack (KB-047 co-located with Shuffle)
          # TheHive 4.1 entrypoint uses Cassandra + local Lucene (no ES flags).
          services:
            cassandra:
              image: cassandra:3.11
              environment:
                - MAX_HEAP_SIZE=1024M
                - HEAP_NEWSIZE=256M
                - CASSANDRA_CLUSTER_NAME=thp
              volumes:
                - thehive-cass-data:/var/lib/cassandra
              restart: unless-stopped
              mem_limit: 1536m

            thehive:
              image: "{{ case_soar_thehive_image }}"
              depends_on:
                - cassandra
              ports:
                - "{{ case_soar_thehive_port }}:9000"
              env_file:
                - thehive.secret.env
              environment:
                - JVM_OPTS=-Xms1g -Xmx1g
              command:
                - --cql-hostnames
                - cassandra
                - --no-config-cortex
              volumes:
                - thehive-data:/data
              restart: unless-stopped
              mem_limit: 1536m

          volumes:
            thehive-cass-data:
            thehive-data:

    - name: Stop and remove obsolete TheHive Elasticsearch (if present)
      ansible.builtin.shell: |
        set -e
        cd "{{ case_soar_thehive_dir }}"
        docker compose stop elasticsearch 2>/dev/null || true
        docker compose rm -f elasticsearch 2>/dev/null || true
        docker rm -f thehive-elasticsearch-1 2>/dev/null || true
      args:
        executable: /bin/bash
      changed_when: true

    - name: Clone official Shuffle repository (pinned shallow)
      ansible.builtin.git:
        repo: "{{ case_soar_shuffle_git_repo }}"
        dest: "{{ case_soar_shuffle_dir }}/src"
        version: "{{ case_soar_shuffle_git_version }}"
        depth: 1
        force: true

    - name: Ensure Shuffle database directory exists with correct ownership
      ansible.builtin.file:
        path: "{{ case_soar_shuffle_dir }}/src/shuffle-database"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"

    - name: Patch Shuffle OpenSearch heap for 8GB co-location
      ansible.builtin.replace:
        path: "{{ case_soar_shuffle_dir }}/src/docker-compose.yml"
        regexp: '"OPENSEARCH_JAVA_OPTS=[^"]*"'
        replace: '"OPENSEARCH_JAVA_OPTS={{ case_soar_shuffle_opensearch_java_opts }}"'

    - name: Bind Shuffle UI to published lab port if needed
      ansible.builtin.debug:
        msg: "Shuffle compose uses upstream defaults; UI expected on port {{ case_soar_shuffle_port }}."

    - name: Start TheHive stack
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - up
          - -d
        chdir: "{{ case_soar_thehive_dir }}"
      register: case_soar_thehive_up

    - name: Start Shuffle stack
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - up
          - -d
        chdir: "{{ case_soar_shuffle_dir }}/src"
      register: case_soar_shuffle_up

    - name: Wait for TheHive HTTP port
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ case_soar_thehive_port }}"
        timeout: 600
        delay: 15

    - name: Wait for Shuffle HTTP port
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ case_soar_shuffle_port }}"
        timeout: 600
        delay: 15

    - name: Record successful install marker
      ansible.builtin.copy:
        dest: "{{ case_soar_install_marker }}"
        mode: "0600"
        owner: root
        group: root
        content: >-
          TheHive+Shuffle co-located on VM 102 (thehive_shuffle)
          at {{ case_soar_management_address }}.
          TheHive :{{ case_soar_thehive_port }} Shuffle :{{ case_soar_shuffle_port }}.

- name: Validate Docker is present
  ansible.builtin.command:
    argv: [docker, --version]
  register: case_soar_docker_ver
  changed_when: false
  when: case_soar_execution_mode in ["install", "validate"]

- name: Validate TheHive port is listening
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ case_soar_thehive_port }}"
    timeout: 30
  when: case_soar_execution_mode in ["install", "validate"]

- name: Validate Shuffle port is listening
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ case_soar_shuffle_port }}"
    timeout: 30
  when: case_soar_execution_mode in ["install", "validate"]

- name: Require install marker on validate
  ansible.builtin.stat:
    path: "{{ case_soar_install_marker }}"
  register: case_soar_marker_validate
  when: case_soar_execution_mode == "validate"

- name: Assert install marker exists
  ansible.builtin.assert:
    that:
      - case_soar_marker_validate.stat.exists
    fail_msg: "case-soar install marker missing."
  when: case_soar_execution_mode == "validate"
