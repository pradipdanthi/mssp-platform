---
# KB-044: Install/enroll Wazuh agent on VM 106 and monitor Suricata eve.json.
# Targets only suricata-sensor. Passive IDS path only — no secrets in Git.

- name: Validate KB-044 execution controls
  ansible.builtin.assert:
    that:
      - suricata_wazuh_execution_mode in ["preflight", "enroll", "validate"]
    fail_msg: >-
      suricata_wazuh_execution_mode must be preflight, enroll, or validate.
      The safe default is preflight.

- name: Validate Suricata sensor inventory identity
  ansible.builtin.assert:
    that:
      - (vm_id | int) == 106
      - deployment_role == "suricata_sensor"
    fail_msg: "KB-044 Suricata→Wazuh role may target only VM 106 (suricata-sensor)."

- name: Validate supported OS and resources
  ansible.builtin.assert:
    that:
      - ansible_distribution in suricata_wazuh_supported_linux_distributions
      - ansible_distribution_version in suricata_wazuh_supported_ubuntu_releases
      - (ansible_memtotal_mb | int) >= (suricata_wazuh_minimum_memory_mb | int)
    fail_msg: >-
      VM 106 must use an approved Ubuntu release with at least
      {{ suricata_wazuh_minimum_memory_mb }} MB RAM.

- name: Resolve root filesystem size
  ansible.builtin.set_fact:
    suricata_wazuh_root_disk_bytes: >-
      {{
        (
          ansible_mounts
          | selectattr("mount", "equalto", "/")
          | map(attribute="size_total")
          | first
        )
        | int
      }}

- name: Validate minimum root filesystem size
  ansible.builtin.assert:
    that:
      - >-
        (suricata_wazuh_root_disk_bytes | int) >=
        ((suricata_wazuh_minimum_root_disk_gb | int) * 1024 * 1024 * 1024)
    fail_msg: >-
      VM 106 requires at least {{ suricata_wazuh_minimum_root_disk_gb }} GB on
      the root filesystem.

- name: Require Suricata eve.json to exist
  ansible.builtin.stat:
    path: "{{ suricata_eve_log_path }}"
  register: suricata_eve_preflight
  check_mode: false

- name: Assert Suricata eve.json is present
  ansible.builtin.assert:
    that:
      - suricata_eve_preflight.stat.exists
    fail_msg: >-
      {{ suricata_eve_log_path }} is missing. Complete KB-043 Suricata install
      before KB-044 integration.

- name: Check TCP reachability to Wazuh Manager agent ports
  ansible.builtin.wait_for:
    host: "{{ wazuh_manager_address }}"
    port: "{{ item }}"
    timeout: 5
    state: started
  loop:
    - "{{ wazuh_manager_port }}"
    - "{{ wazuh_manager_enrollment_port }}"
  when: suricata_wazuh_execution_mode in ["preflight", "enroll"]
  register: suricata_wazuh_manager_ports
  failed_when: false
  changed_when: false
  check_mode: false

- name: Require Manager agent ports reachable from the sensor
  ansible.builtin.assert:
    that:
      - suricata_wazuh_manager_ports.results | map(attribute='failed') | select | list | length == 0
    fail_msg: >-
      VM 106 cannot reach Wazuh Manager {{ wazuh_manager_address }} on ports
      {{ wazuh_manager_port }}/{{ wazuh_manager_enrollment_port }}.
  when: suricata_wazuh_execution_mode in ["preflight", "enroll"]

- name: Explain the preflight-only result
  ansible.builtin.debug:
    msg: >-
      KB-044 Suricata→Wazuh preflight passed for VM 106. No packages were
      installed. A separate approval is required before
      suricata_wazuh_execution_mode=enroll and
      suricata_wazuh_live_enroll_approved=true.
  when: suricata_wazuh_execution_mode == "preflight"

- name: Check enrollment marker
  ansible.builtin.stat:
    path: "{{ suricata_wazuh_install_marker }}"
  register: suricata_wazuh_marker

- name: Install, enroll, and configure Suricata eve.json forwarding
  when:
    - suricata_wazuh_execution_mode == "enroll"
    - not suricata_wazuh_marker.stat.exists
  block:
    - name: Enforce explicit live-enroll approval and enrollment secret policy
      ansible.builtin.assert:
        that:
          - suricata_wazuh_live_enroll_approved | bool
          - >-
            (wazuh_agent_authd_passwordless | bool)
            or
            (
              wazuh_agent_enrollment_password is string
              and (wazuh_agent_enrollment_password | length) >= 8
              and not (wazuh_agent_enrollment_password | regex_search('^<SET_'))
            )
        fail_msg: >-
          Live Suricata→Wazuh enrollment is blocked. Approve the change and
          either use passwordless authd or supply a Vault/runtime enrollment
          password — never Git.
      no_log: true

    - name: Install prerequisite packages for the Wazuh APT repository
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Download the official Wazuh repository GPG key
      ansible.builtin.get_url:
        url: "{{ wazuh_agent_gpg_key_url }}"
        dest: /tmp/GPG-KEY-WAZUH
        mode: "0644"
        validate_certs: true

    - name: Install the Wazuh repository GPG keyring
      ansible.builtin.command:
        argv:
          - gpg
          - --dearmor
          - --yes
          - -o
          - "{{ wazuh_agent_apt_keyring }}"
          - /tmp/GPG-KEY-WAZUH
      args:
        creates: "{{ wazuh_agent_apt_keyring }}"

    - name: Restrict the Wazuh repository keyring permissions
      ansible.builtin.file:
        path: "{{ wazuh_agent_apt_keyring }}"
        owner: root
        group: root
        mode: "0644"

    - name: Add the official Wazuh APT repository
      ansible.builtin.copy:
        dest: "{{ wazuh_agent_apt_list }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          deb [signed-by={{ wazuh_agent_apt_keyring }}] {{ wazuh_agent_repo_url }} stable main

    - name: Install the pinned Wazuh agent package
      ansible.builtin.apt:
        name: "wazuh-agent={{ wazuh_agent_package_version }}"
        state: present
        update_cache: true
        allow_downgrade: true

    - name: Configure the Wazuh Manager address in the agent config
      ansible.builtin.replace:
        path: /var/ossec/etc/ossec.conf
        regexp: '<address>.*</address>'
        replace: '<address>{{ wazuh_manager_address }}</address>'
        after: '<client>'
        before: '</client>'

    - name: Ensure Suricata eve.json localfile monitor is configured
      ansible.builtin.blockinfile:
        path: /var/ossec/etc/ossec.conf
        marker: "<!-- {mark} MSSP KB-044 Suricata eve.json -->"
        insertbefore: "</ossec_config>"
        block: |
          <localfile>
            <log_format>json</log_format>
            <location>{{ suricata_eve_log_path }}</location>
          </localfile>

    - name: Enroll the agent with the Manager via authd
      ansible.builtin.command:
        argv: "{{ wazuh_agent_auth_argv }}"
      vars:
        wazuh_agent_auth_argv: >-
          {{
            ['/var/ossec/bin/agent-auth', '-m', wazuh_manager_address, '-A', wazuh_agent_name]
            + (
              []
              if (wazuh_agent_authd_passwordless | bool)
              else ['-P', wazuh_agent_enrollment_password]
            )
          }}
      args:
        creates: /var/ossec/etc/client.keys
      no_log: true
      register: suricata_wazuh_auth_result

    - name: Enable and start the Wazuh agent service
      ansible.builtin.systemd:
        name: wazuh-agent
        enabled: true
        state: restarted
        daemon_reload: true

    - name: Disable the Wazuh APT repository after enrollment
      ansible.builtin.replace:
        path: "{{ wazuh_agent_apt_list }}"
        regexp: '^deb '
        replace: '#deb '

    - name: Create the restricted Suricata→Wazuh state directory
      ansible.builtin.file:
        path: "{{ suricata_wazuh_state_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Record successful pinned-version enrollment
      ansible.builtin.copy:
        content: >-
          Wazuh agent {{ wazuh_agent_version }} enrolled to
          {{ wazuh_manager_address }} as {{ wazuh_agent_name }} with
          Suricata eve.json localfile monitor.
        dest: "{{ suricata_wazuh_install_marker }}"
        owner: root
        group: root
        mode: "0600"

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto
  when: suricata_wazuh_execution_mode in ["enroll", "validate"]

- name: Verify the pinned Wazuh agent package version
  ansible.builtin.assert:
    that:
      - "'wazuh-agent' in ansible_facts.packages"
      - ansible_facts.packages["wazuh-agent"][0].version is match("^" ~ wazuh_agent_version ~ "([.-]|$)")
    fail_msg: "Installed wazuh-agent does not match pinned version {{ wazuh_agent_version }}."
  when: suricata_wazuh_execution_mode in ["enroll", "validate"]

- name: Gather service facts
  ansible.builtin.service_facts:
  when: suricata_wazuh_execution_mode in ["enroll", "validate"]

- name: Verify the Wazuh agent service is running
  ansible.builtin.assert:
    that:
      - "'wazuh-agent.service' in ansible_facts.services"
      - ansible_facts.services['wazuh-agent.service'].state == "running"
    fail_msg: "wazuh-agent.service is not installed and running."
  when: suricata_wazuh_execution_mode in ["enroll", "validate"]

- name: Verify Suricata eve.json localfile is present in agent config
  ansible.builtin.command:
    argv:
      - grep
      - -F
      - "{{ suricata_eve_log_path }}"
      - /var/ossec/etc/ossec.conf
  register: suricata_wazuh_localfile_check
  changed_when: false
  when: suricata_wazuh_execution_mode in ["enroll", "validate"]

- name: Require eve.json localfile configuration
  ansible.builtin.assert:
    that:
      - suricata_wazuh_localfile_check.rc == 0
    fail_msg: "Agent ossec.conf missing Suricata eve.json localfile monitor."
  when: suricata_wazuh_execution_mode in ["enroll", "validate"]
