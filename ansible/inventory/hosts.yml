# KB-039/041: Lab inventory — deployed VMs 100, 101, and 112 plus
# placeholders for future SOC VMs 102–111. No secrets.
---
all:
  children:
    automation_controller:
      hosts:
        automation:
          ansible_host: 192.168.0.222
          ansible_connection: local
          vm_id: 112
          deployment_role: ansible_controller

    control_plane:
      hosts:
        mssp-control:
          ansible_host: 192.168.0.201
          vm_id: 100
          deployment_role: control_plane

    wazuh_stack:
      hosts:
        wazuh-stack:
          ansible_host: 192.168.0.211
          ansible_user: secadmin
          ansible_ssh_private_key_file: /home/secadmin/.ssh/id_ed25519_ansible_wazuh
          ansible_become: true
          vm_id: 101
          deployment_role: wazuh_cluster

    case_management:
      hosts:
        thehive_shuffle:
          ansible_host: 192.168.0.212
          ansible_user: secadmin
          ansible_ssh_private_key_file: /home/secadmin/.ssh/id_ed25519_ansible_case_soar
          ansible_become: true
          vm_id: 102
          deployment_role: case_soar
          # Lab co-location: TheHive + Shuffle on one VM (8 GB).
          # Roadmap VM 103 slot deferred — no separate shuffle host.

    soar:
      hosts:
        # Placeholder retained for roadmap identity; live Shuffle runs on VM 102.
        shuffle:
          ansible_host: 192.168.0.212
          vm_id: 102
          deployment_role: case_soar_colocated_shuffle
          colocated_with: thehive_shuffle

    endpoint_lab:
      hosts:
        windows-endpoint-lab:
          ansible_host: 192.168.0.214
          vm_id: 104
          deployment_role: wazuh_agent_windows
        linux-endpoint-lab:
          ansible_host: 192.168.0.215
          ansible_user: secadmin
          ansible_ssh_private_key_file: /home/secadmin/.ssh/id_ed25519_linux_endpoint
          ansible_become: true
          vm_id: 105
          deployment_role: wazuh_agent_linux

    network_sensors:
      hosts:
        suricata-sensor:
          ansible_host: 192.168.0.216
          ansible_user: secadmin
          ansible_ssh_private_key_file: /home/secadmin/.ssh/id_ed25519_ansible_suricata
          ansible_become: true
          vm_id: 106
          deployment_role: suricata_sensor
        # KB-047: Zeek co-located on VM 106 (not a separate VM 107 in lab).
        zeek-sensor:
          ansible_host: 192.168.0.216
          ansible_user: secadmin
          ansible_ssh_private_key_file: /home/secadmin/.ssh/id_ed25519_ansible_suricata
          ansible_become: true
          vm_id: 106
          deployment_role: zeek_sensor_colocated
          colocated_with: suricata-sensor

    threat_intel:
      hosts:
        misp:
          ansible_host: 192.168.0.218
          ansible_user: secadmin
          ansible_ssh_private_key_file: /home/secadmin/.ssh/id_ed25519_misp
          ansible_become: true
          vm_id: 108
          deployment_role: misp

    vulnerability:
      hosts:
        greenbone:
          ansible_host: 192.168.0.219
          ansible_user: secadmin
          ansible_ssh_private_key_file: /home/secadmin/.ssh/id_ed25519_greenbone
          ansible_become: true
          vm_id: 109
          deployment_role: greenbone

    # KB-078: Nuclei+Vuls free stack — co-located on VM 109 with Greenbone (not control plane).
    # SSH as secadmin + become (sudo); root SSH login is not used.
    vuln_free_stack:
      hosts:
        greenbone-vuln-free:
          ansible_host: 192.168.0.219
          ansible_user: secadmin
          ansible_ssh_private_key_file: /home/secadmin/.ssh/id_ed25519_greenbone
          ansible_become: true
          vm_id: 109
          deployment_role: vuln_free_stack
          colocated_with: greenbone

    dfir:
      hosts:
        velociraptor:
          ansible_host: 192.168.0.220
          ansible_user: secadmin
          ansible_ssh_private_key_file: /home/secadmin/.ssh/id_ed25519_velociraptor
          ansible_become: true
          vm_id: 110
          deployment_role: velociraptor

    # Amass + EASM agent — co-located on VM 109 with Greenbone / Nuclei.
    easm_recon_stack:
      hosts:
        greenbone-easm:
          ansible_host: 192.168.0.219
          ansible_user: secadmin
          ansible_ssh_private_key_file: /home/secadmin/.ssh/id_ed25519_greenbone
          ansible_become: true
          vm_id: 109
          deployment_role: easm_recon_stack
          colocated_with: greenbone

    monitoring_stack:
      hosts:
        monitoring:
          ansible_host: 192.168.0.221
          vm_id: 111
          deployment_role: monitoring

    # Disposable Kevantic field-image factory (KB-093F). Recreate VM 113 when building ISOs.
    # Lab note 2026-08-05: VM 113 destroyed while idle — host entry retained for recreate scripts.
    kevantic_appliance_build:
      hosts:
        kevantic-appliance-build:
          ansible_host: 192.168.0.223
          ansible_user: kevantic
          ansible_ssh_private_key_file: /home/secadmin/.ssh/id_ed25519_kevantic_build
          ansible_become: true
          vm_id: 113
          deployment_role: kevantic_appliance_factory
          present: false

    # Permanent Appliance Management plane (KB-093L) — channel gateway off VM 100.
    appliance_management:
      hosts:
        kevantic-appliance-mgmt:
          ansible_host: 192.168.0.224
          ansible_user: kevantic
          ansible_ssh_private_key_file: /opt/mssp-control/kevantic-appliance/.tools/build-ssh/kevantic_packer
          ansible_become: true
          vm_id: 114
          deployment_role: appliance_management_plane
