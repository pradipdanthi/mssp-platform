services:
  soc-agent:
    build: .
    container_name: mssp-soc-agent
    restart: unless-stopped
    # Gemini brief uses 8443; keep 8088 for earlier lab callers
    ports:
      - "8443:8443"
      - "8088:8443"
    environment:
      SOC_AGENT_INGEST_TOKEN: ${SOC_AGENT_INGEST_TOKEN:?set ingest token}
      SOC_AGENT_NAME: ${SOC_AGENT_NAME:-mssp-soc-agent}
      SOC_AGENT_PORT: "8443"
      SOC_AGENT_AUDIT_LOG: /var/log/soc-agent/audit.log
      SOC_AGENT_TRIAGE_AUDIT_LOG: /var/log/soc-agent/triage_audit.log
      SOC_AGENT_DOSSIER_DIR: /var/lib/soc-agent/dossiers
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.0.227:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      OTX_API_KEY: ${OTX_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    volumes:
      - soc_agent_logs:/var/log/soc-agent
      - soc_agent_data:/var/lib/soc-agent
    # host network not required; Ollama is on LAN
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8443/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1536m
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  soc_agent_logs:
  soc_agent_data:
