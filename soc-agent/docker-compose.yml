services:
  soc-agent:
    build: .
    container_name: mssp-soc-agent
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SOC_AGENT_INGEST_TOKEN: ${SOC_AGENT_INGEST_TOKEN:?set ingest token}
      SOC_AGENT_NAME: ${SOC_AGENT_NAME:-mssp-soc-agent}
      SOC_AGENT_AUDIT_LOG: /var/log/soc-agent/audit.log
      SOC_AGENT_DOSSIER_DIR: /var/lib/soc-agent/dossiers
    volumes:
      - soc_agent_logs:/var/log/soc-agent
      - soc_agent_data:/var/lib/soc-agent
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  soc_agent_logs:
  soc_agent_data:
